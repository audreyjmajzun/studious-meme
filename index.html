<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chem 6A Final Prep</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ff5a4e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Pacifico&family=Fredoka:wght@500;600&family=Shrikhand&family=Righteous&display=swap" rel="stylesheet">
<style>
/* VOICE everyday study tool: calm, quick to scan, built for an iPad
   IDEA a periodic table: every topic is an element tile, coloured by the exam section it belongs to
   PICTURE the day plan with a progress ring; topic tiles whose bars fill as you master them; Lewis structures drawn live
   COLOUR white ground, ink #15171c; section 3 coral #ff5a4e, section 2 blue #2f6bff, section 1 gold #f2b400
   TYPE Space Grotesk 700 for titles and tile symbols, Inter for text
   LAYOUT sticky title + tabs; two-column cards on iPad, one column under 700px */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#101216);--ink:light-dark(#15171c,#eef0f4);--mut:light-dark(#5d6370,#9aa1ad);--line:light-dark(#e4e6eb,#262a33);--card:light-dark(#f6f7f9,#171a20);--s3:#ff5a4e;--s2:#2f6bff;--s1:#f2b400;--s3t:light-dark(#fff0ee,#2a1715);--s2t:light-dark(#edf2ff,#141c30);--s1t:light-dark(#fff8e0,#272010);--ok:#12a150;--bad:#e5484d}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}body{background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip;-webkit-text-size-adjust:100%}
h1,h2,.sym,.ring b,.secres b{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.02em}
h1{font-size:clamp(30px,4.2vw,44px);line-height:1.05;margin:4px 0 10px;text-wrap:balance}h2{font-size:21px;line-height:1.2;margin:22px 0 10px}
.band{padding:clamp(18px,3vw,36px) max(4vw,16px);max-width:1180px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px max(4vw,16px) 6px;max-width:1180px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font:700 18px "Space Grotesk",sans-serif}.brand i{display:grid;place-items:center;width:34px;height:34px;border-radius:7px;background:var(--s3);color:var(--on3,#fff);font-style:normal;font-size:15px}
#count{font-size:14px;color:var(--mut);white-space:nowrap}#count b{color:var(--s3);font-size:18px}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:4px max(4vw,16px) 8px;max-width:1180px;margin:0 auto;scrollbar-width:none}
.tabs button{flex:none;border:0;background:none;color:var(--mut);font:600 15px Inter,sans-serif;padding:10px 14px;border-radius:999px;min-height:44px;cursor:pointer}
.tabs button.on{background:var(--ink);color:var(--bg)}
button{font:inherit;color:inherit}.scroll{overflow-x:auto}
.btn{border:0;background:var(--ink);color:var(--bg);font-weight:600;padding:11px 18px;border-radius:10px;min-height:44px;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}.btn.bad{background:var(--bad);color:#fff}.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.tile:focus-visible{outline:3px solid var(--s2);outline-offset:2px}
.sm{border:0;background:var(--s3);color:var(--on3,#fff);font-weight:600;font-size:14px;padding:8px 14px;border-radius:8px;min-height:40px;cursor:pointer;flex:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}.row.end{justify-content:flex-start}.row.center{justify-content:center}
.muted{color:var(--mut);font-size:14px}.why{color:var(--mut);max-width:62ch;margin:0 0 8px}
.eyebrow{font-size:14px;color:var(--mut);margin:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:baseline}.dot.s3{background:var(--s3)}.dot.s2{background:var(--s2)}.dot.s1{background:var(--s1)}
.card{background:var(--card);border-radius:14px;padding:18px 20px;border:1px solid var(--line)}.card h2{margin-top:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media(max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}
/* daily */
.head{padding-bottom:6px}.strip{display:flex;gap:6px;padding-bottom:6px}
.day{flex:none;width:56px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 0 8px;display:grid;justify-items:center;cursor:pointer;position:relative;min-height:66px}
.day small{font-size:13px;color:var(--mut)}.day b{font:700 20px "Space Grotesk"}.day i{position:absolute;left:8px;right:8px;bottom:5px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--s3) var(--p),var(--line) var(--p))}
.day.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.day.on small{color:inherit;opacity:.75}.day.today b::after{content:"";display:block;width:5px;height:5px;margin:0 auto;border-radius:50%;background:var(--s3)}
.dhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;margin-top:14px}
.ring{--p:0;width:118px;aspect-ratio:1;border-radius:50%;display:grid;place-content:center;text-align:center;background:radial-gradient(closest-side,var(--bg) 78%,transparent 79%),conic-gradient(var(--s3) calc(var(--p)*1%),var(--line) 0)}
.ring b{font-size:30px;line-height:1}.ring small{font-size:13px;color:var(--mut);max-width:70px}
.tasks,.read,.todo,.wt{list-style:none;padding:0;margin:0}
.tasks li,.read li,.todo li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.tasks li:first-child,.read li:first-child,.todo li:first-child{border-top:0}
.done>.chk span{text-decoration:line-through;color:var(--mut)}
.chk{display:flex;gap:12px;align-items:flex-start;cursor:pointer;flex:1}.chk input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--s3);flex:none}
.chk small{display:block;color:var(--mut);font-size:13px}.tog{margin-top:8px;font-size:15px}
.wt li{padding:4px 0}.wt b{float:right}
#tdf{margin-top:0}#tdi{flex:1;min-width:160px;font:16px Inter,sans-serif;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);min-height:44px}
.x{border:0;background:none;font-size:24px;color:var(--mut);width:40px;height:40px;cursor:pointer}
/* tiles */
.sech{display:flex;align-items:center;font-size:18px;margin-top:28px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;text-align:left;border:0;border-radius:12px;padding:12px 12px 10px;min-height:150px;display:flex;flex-direction:column;cursor:pointer;color:var(--ink)}
.tile.s3{background:var(--s3t);box-shadow:inset 0 0 0 2px var(--s3)}.tile.s2{background:var(--s2t);box-shadow:inset 0 0 0 2px var(--s2)}.tile.s1{background:var(--s1t);box-shadow:inset 0 0 0 2px var(--s1)}
.tile .num{font-size:13px;font-weight:600;color:var(--mut)}.tile .sym{font-size:40px;font-weight:700;line-height:1.05}.tile .nm{font-size:14px;font-weight:600;line-height:1.25;flex:1;margin-top:2px}
.tile .ms{height:5px;border-radius:3px;background:color-mix(in srgb,var(--ink) 12%,transparent);margin-top:8px;overflow:hidden}.tile .ms i{display:block;height:100%;background:var(--ink)}
.tile .pc{font-size:13px;color:var(--mut);margin-top:4px}
/* lesson */
.lesson{max-width:820px}.back{border:0;background:none;color:var(--mut);font-weight:600;padding:10px 0;min-height:44px;cursor:pointer}
.refs{font-size:14px;color:var(--mut);border-left:3px solid var(--s3);padding-left:12px}
.blk{border-top:1px solid var(--line);padding:6px 0 10px}.blk h2{display:flex;gap:12px;align-items:baseline}.blk h2 span{font-size:15px;color:var(--mut)}
.blk ul,.blk ol{padding-left:22px}.blk li{margin:4px 0}
.key{background:var(--s3t);border-left:4px solid var(--s3);border-radius:8px;padding:10px 14px;margin:10px 0}
.ex{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:15px}
/* quiz */
.quiz{max-width:760px}.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:10px}.prog i{display:block;height:100%;background:var(--s3);transition:width .3s}
.qq{font-size:19px;line-height:1.5;margin:14px 0 18px;font-weight:500}
.opts{display:grid;gap:10px}.opt{display:flex;gap:14px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 16px;min-height:52px;cursor:pointer;font-size:16px}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--card);font-weight:700;font-size:14px}.opt .ot{flex:1}
.opt:hover:not(:disabled){border-color:var(--ink)}.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--bg))}.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--bg))}.opt:disabled{cursor:default;color:var(--ink)}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px}.fb.ok{background:color-mix(in srgb,var(--ok) 13%,var(--bg))}.fb.bad{background:color-mix(in srgb,var(--bad) 12%,var(--bg))}
.rank .hl{font-size:14px;font-weight:600;color:var(--mut);margin:6px 0}.slots{list-style:decimal;padding-left:26px;margin:0}.slots li{padding:4px 0;min-height:52px}
.ph{display:inline-block;border:1.5px dashed var(--line);border-radius:10px;padding:8px 14px;color:var(--mut);font-size:14px}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 16px;min-height:44px;font-weight:600;font-size:17px;cursor:pointer;flex:none}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.secres{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:14px 0}.secres .card p{margin:0;font-weight:600}.secres b{font-size:40px;display:block;line-height:1.1}.secres small{color:var(--mut)}
.secres .s3{border-top:5px solid var(--s3)}.secres .s2{border-top:5px solid var(--s2)}.secres .s1{border-top:5px solid var(--s1)}
.miss{border-top:1px solid var(--line);padding:12px 0}.miss .ans{margin:6px 0 0}
.big3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0}@media(max-width:700px){.big3{grid-template-columns:minmax(0,1fr)}}
.bigb{border:0;border-radius:14px;padding:20px;text-align:left;cursor:pointer;display:grid;gap:6px;min-height:120px;align-content:end}.bigb b{font:700 22px "Space Grotesk"}.bigb span{font-size:14px;opacity:.85}
.bigb.s0{background:var(--ink);color:var(--bg)}.bigb.s3{background:var(--s3);color:var(--on3,#fff)}.bigb.s2{background:var(--s2);color:var(--on2,#fff)}
/* cards */
.fc{max-width:680px}.flash{width:100%;min-height:280px;border:0;border-radius:18px;padding:28px;display:grid;place-content:center;gap:16px;text-align:center;cursor:pointer;margin:12px 0}
.flash.s3{background:var(--s3t);box-shadow:inset 0 0 0 2px var(--s3)}.flash.s2{background:var(--s2t);box-shadow:inset 0 0 0 2px var(--s2)}.flash.s1{background:var(--s1t);box-shadow:inset 0 0 0 2px var(--s1)}
.flash .face{font:700 28px/1.2 "Space Grotesk",sans-serif}.flash .back{font-size:18px;line-height:1.5}.flash small{color:var(--mut)}.flash.flip .face{font-size:18px;color:var(--mut)}
/* lewis */
.mols{display:flex;gap:8px;padding-bottom:6px}
.lab{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;margin-top:12px}@media(max-width:760px){.lab{grid-template-columns:minmax(0,1fr)}}
.pic{display:grid;place-items:center;min-height:280px;background:var(--bg)}.lew{width:100%;max-width:460px;height:auto}
.lew .bd{stroke:var(--ink);stroke-width:2.4;stroke-linecap:round}.lew .dt{fill:var(--s3)}.lew .rad{fill:var(--s2)}
.lew .el{font:700 20px "Space Grotesk",sans-serif;text-anchor:middle;fill:var(--ink)}.lew .fc{font:700 12px Inter,sans-serif;fill:var(--s2);text-anchor:middle}.lew .fc.big{font-size:16px}.lew .brk{font:300 64px Inter,sans-serif;fill:var(--mut)}
.reveal{border:2px dashed var(--line);background:none;border-radius:14px;padding:40px 24px;font-weight:600;cursor:pointer;color:var(--mut)}
/* cheat */
.cheat{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;margin-bottom:16px}@media(max-width:860px){.cheat{grid-template-columns:minmax(0,1fr)}}
.trend{width:100%;height:auto}.trend .sb{fill:var(--s3);opacity:.85}.trend .pb{fill:var(--s1);opacity:.85}.trend .db{fill:var(--s2);opacity:.55}
.trend .ar{stroke:var(--ink);stroke-width:3}.trend .ahd{fill:var(--ink)}.trend .tl{font:600 14px Inter,sans-serif;fill:var(--ink);text-anchor:middle}.trend .tl.st{text-anchor:start}
.eq{width:100%;border-collapse:collapse}.eq td{padding:8px 4px;border-top:1px solid var(--line);vertical-align:top}.eq tr:first-child td{border-top:0}.eq td:first-child{font-weight:600;white-space:nowrap}
.rules{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 18px;margin:0}.rules dt{font-weight:700}.rules dd{margin:0}
@media(max-width:600px){.rules{grid-template-columns:minmax(0,1fr)}.rules dd{margin-bottom:8px}.eq td:first-child{white-space:normal}}
/* progress */
.bars{display:grid;gap:8px}.bar{display:grid;grid-template-columns:minmax(0,15em) minmax(0,1fr) 5em;gap:12px;align-items:center;font-size:15px}
.tr{height:12px;border-radius:6px;background:var(--line);overflow:hidden}.tr i{display:block;height:100%}.tr i.s3{background:var(--s3)}.tr i.s2{background:var(--s2)}.tr i.s1{background:var(--s1)}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.bar small{color:var(--mut)}
@media(max-width:600px){.bar{grid-template-columns:minmax(0,1fr) 4.5em}.bar .tr{grid-column:1/-1;grid-row:2}.dhead{grid-template-columns:minmax(0,1fr)}.ring{width:96px}.qq{font-size:18px}}

/* notes */
.notes{max-width:820px}.nbody h3{font:700 19px "Space Grotesk",sans-serif;margin:26px 0 8px;letter-spacing:-.01em}.nbody p,.nbody li{line-height:1.6}.nbody ul,.nbody ol{padding-left:22px}.nbody li{margin:4px 0}
.formula{background:var(--s3t);border-left:4px solid var(--s3);border-radius:8px;padding:10px 14px;margin:12px 0;font-weight:600;overflow-x:auto}
.nt{border-collapse:collapse;width:100%;font-size:15px;margin:10px 0}.nt th,.nt td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}.nt th{font-weight:700;background:var(--card)}
.nend{display:flex;flex-wrap:wrap;gap:10px;border-top:1px solid var(--line);margin-top:24px;padding-top:16px}
.nlist{display:grid;gap:8px;max-width:760px}.nrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px 16px;min-height:52px;cursor:pointer}.nrow small{color:var(--mut);white-space:nowrap}
/* why */
.whyn{margin:10px 0 0}.whyall{margin-top:10px;font-size:15px}.whyall summary{cursor:pointer;font-weight:600;color:var(--mut);min-height:36px;padding:6px 0}.whyall ul{padding-left:20px;margin:6px 0}.whyall li{margin:6px 0}
/* drill */
.drillbar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}.drillbar b{font:700 34px "Space Grotesk",sans-serif}.drillbar span b{font-size:24px}
.fl-ok{animation:fok .5s}.fl-bad{animation:fbad .5s}@keyframes fok{from{background:color-mix(in srgb,var(--ok) 25%,transparent)}to{background:transparent}}@keyframes fbad{from{background:color-mix(in srgb,var(--bad) 25%,transparent)}to{background:transparent}}
.bigb.s1{background:var(--s1);color:var(--on1,#15171c)}.big3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
/* predictor + backup */
.pred{margin:18px 0}.pin{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:10px 0}.pin label{display:grid;gap:4px;font-size:14px;font-weight:600}
.pin input,textarea{font:16px Inter,sans-serif;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.pout{display:flex;gap:16px;align-items:center;margin:12px 0;flex-wrap:wrap}.pout .big{font:700 52px "Space Grotesk",sans-serif;color:var(--s3);line-height:1}
textarea{min-height:80px;margin:8px 0;resize:vertical;font-size:13px;font-family:ui-monospace,Menlo,monospace}
sup,sub{font-size:.72em;line-height:0}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* themes */
.topr{display:flex;align-items:center;gap:10px}
@media(max-width:560px){#count{white-space:normal;text-align:right;line-height:1.2;font-size:13px}#count b{font-size:16px}}
.themebtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:18px;cursor:pointer;flex:none}
body.themed{background:var(--bgfull,var(--bg));background-attachment:fixed}
body.themed header{background:var(--hdrbg,var(--bg));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
body.themed h1,body.themed .brand{font-family:var(--tfont,"Space Grotesk"),"Space Grotesk",sans-serif}
.th-ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.th-ov{align-items:center}}
.th-sh{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:90vh;overflow:auto;padding:18px 18px calc(22px + env(safe-area-inset-bottom))}
@media(min-width:700px){.th-sh{border-radius:20px}}
.th-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.th-h h2{margin:0}
.th-x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer}
.th-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.th-opt{padding:11px;border-radius:14px;border:2px solid var(--line);text-align:left;display:grid;gap:7px;cursor:pointer;font:600 14px Inter,sans-serif}
.th-opt .sw{display:flex;gap:4px}.th-opt .sw i{width:15px;height:15px;border-radius:50%}
.th-seg{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.th-seg button{border:0;background:none;padding:8px 14px;border-radius:9px;font:600 14px Inter,sans-serif;color:var(--mut);cursor:pointer;min-height:38px}
.th-seg button.on{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.th-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0;flex-wrap:wrap}
.th-lbl{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 8px}
</style></head><body>

<script>
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
// ===== Section 3: material after Midterm 2 (Lectures 20–24) =====

const TOPICS = [
 {id:'mea',sec:3,sym:'Ma',n:'Many-electron atoms',src:'Topic 1E · Lectures 20–21',
  lesson:[
  ['Why hydrogen is the easy case',`Hydrogen has one electron, so nothing gets in its way: every orbital with the same <b>n</b> has the same energy (2s = 2p). Add more electrons and two things change:
  <ul><li>The nucleus has more protons, so it pulls harder and every orbital drops in energy.</li>
  <li>Electrons repel each other. Inner electrons sit between the nucleus and outer electrons and block part of the pull. This is called <b>shielding</b>.</li></ul>`],
  ['Effective nuclear charge (Z<sub>eff</sub>)',`An outer electron doesn't feel the full charge Z of the nucleus. It feels a smaller "net" charge, <b>Z<sub>eff</sub></b>, because the electrons underneath shield it.
  <div class="key">Z<sub>eff</sub> &lt; Z, always. Example from lecture: in He (Z = 2), each electron feels Z<sub>eff</sub> ≈ 1.3–1.7, not 2.</div>
  Rough mental model: Z<sub>eff</sub> ≈ (protons) − (core electrons). Across a period you add a proton each step but the core stays the same, so Z<sub>eff</sub> climbs. That one fact drives almost every trend in Topic 1F.`],
  ['Penetration: why s &lt; p &lt; d &lt; f',`For the same n, an s electron spends some time very close to the nucleus (it <b>penetrates</b> the inner shells), so it's less shielded and lower in energy. p penetrates less, d less still.
  <div class="key">In a many-electron atom, for a given n: <b>s &lt; p &lt; d &lt; f</b> in energy.</div>
  That's why 2s fills before 2p, and why 4s fills before 3d.`],
  ['Writing electron configurations',`Fill orbitals from lowest energy up (<b>Aufbau</b>): 1s 2s 2p 3s 3p 4s 3d 4p 5s 4d 5p…
  <ul><li><b>Pauli exclusion:</b> max 2 electrons per orbital, with opposite spins. So s holds 2, p holds 6, d holds 10.</li>
  <li><b>Hund's rule:</b> in a set of equal-energy orbitals (like the three 2p), put electrons in singly with parallel spins before pairing. N (2p<sup>3</sup>) has 3 unpaired electrons.</li></ul>
  <div class="ex"><b>Worked example, sulfur (16 e⁻):</b> 1s<sup>2</sup> 2s<sup>2</sup> 2p<sup>6</sup> 3s<sup>2</sup> 3p<sup>4</sup>. Short form: [Ne]3s<sup>2</sup>3p<sup>4</sup>. Write the previous noble gas in brackets, then the rest.</div>
  <div class="ex"><b>Selenium (34 e⁻):</b> [Ar]3d<sup>10</sup>4s<sup>2</sup>4p<sup>4</sup>.</div>`],
  ['The exceptions you must know',`Half-full and full d subshells are extra stable, so one 4s electron moves into 3d:
  <div class="key">Cr = [Ar]3d<sup>5</sup>4s<sup>1</sup> (not 3d<sup>4</sup>4s<sup>2</sup>)<br>Cu = [Ar]3d<sup>10</sup>4s<sup>1</sup> (not 3d<sup>9</sup>4s<sup>2</sup>)<br>Same pattern for Mo and Ag (the elements under them).</div>`],
  ['Core vs valence electrons',`<b>Core</b> electrons are inner and unreactive. <b>Valence</b> electrons are outer and do the chemistry.
  <div class="key">Course definition: valence electrons = all electrons after the noble-gas core, <b>except</b> a full subshell with a lower n.</div>
  <ul><li>Ga = [Ar]3d<sup>10</sup>4s<sup>2</sup>4p<sup>1</sup>: the 3d<sup>10</sup> is full and has lower n, so it counts as core. 3 valence electrons.</li>
  <li>Ti = [Ar]3d<sup>2</sup>4s<sup>2</sup>: 3d isn't full, so it's valence. 4 valence electrons.</li>
  <li>Bi = [Xe]4f<sup>14</sup>5d<sup>10</sup>6s<sup>2</sup>6p<sup>3</sup>: 4f and 5d are full, so they're core. 5 valence electrons.</li></ul>`]
 ]},
 {id:'rad',sec:3,sym:'Rd',n:'Atomic & ionic radius',src:'Topic 1F · Lectures 21–22',
  lesson:[
  ['The two rules',`<div class="key"><b>Down a group: radius gets bigger.</b> Each row adds a new shell (higher n), farther out.<br><b>Across a period (left → right): radius gets smaller.</b> Same core, more protons, so Z<sub>eff</sub> goes up and the cloud gets pulled in.</div>
  Biggest atoms are bottom-left (Cs, Fr). Smallest are top-right (He, F).`],
  ['Cations are smaller than their atom',`Na → Na<sup>+</sup>: losing the 3s electron empties the whole n = 3 shell. What's left is the n = 2 shell, much closer in. Also, the same number of protons now pulls on fewer electrons.
  <div class="key">Cation &lt; parent atom. The higher the positive charge, the smaller it gets (Fe<sup>3+</sup> &lt; Fe<sup>2+</sup>).</div>`],
  ['Anions are bigger than their atom',`Cl → Cl<sup>−</sup>: same protons, one more electron. The extra electron adds repulsion, so the cloud swells.
  <div class="key">Anion &gt; parent atom.</div>`],
  ['Isoelectronic series',`<b>Isoelectronic</b> means same number of electrons. When electrons are equal, more protons means smaller.
  <div class="ex">All have 10 electrons ([Ne]):<br>N<sup>3−</sup> (7 p) &gt; O<sup>2−</sup> (8 p) &gt; F<sup>−</sup> (9 p) &gt; Na<sup>+</sup> (11 p) &gt; Mg<sup>2+</sup> (12 p) &gt; Al<sup>3+</sup> (13 p)</div>
  Shortcut: the most negative ion is biggest, the most positive is smallest.`]
 ]},
 {id:'ie',sec:3,sym:'Ie',n:'Ionization energy',src:'Topic 1F · Lecture 22',
  lesson:[
  ['What it is',`<b>Ionization energy (I)</b> is the minimum energy to pull an electron off a gas-phase atom. It is always positive, because energy always has to be put in.
  <div class="ex">I<sub>1</sub>: Li(g) → Li<sup>+</sup>(g) + e⁻ &nbsp; 519 kJ/mol<br>I<sub>2</sub>: Li<sup>+</sup>(g) → Li<sup>2+</sup>(g) + e⁻ &nbsp; 7300 kJ/mol</div>`],
  ['The trend (opposite of radius)',`<div class="key"><b>Up a group: IE increases.</b> The electron is closer and held tighter.<br><b>Across a period: IE increases.</b> Z<sub>eff</sub> goes up.</div>
  Highest: top-right (He, Ne, F). Lowest: bottom-left (Cs).`],
  ['Two exceptions (very testable)',`<ul><li><b>Be &gt; B</b> (and Mg &gt; Al): B's outer electron is in 2p, which is higher in energy and more shielded than 2s, so it's easier to remove.</li>
  <li><b>N &gt; O</b> (and P &gt; S): O has 2p<sup>4</sup>, so one 2p orbital holds a <b>pair</b>. The pair repels, which makes that electron easier to remove. N's 2p<sup>3</sup> has no pairs.</li></ul>
  <div class="ex">Rank I<sub>1</sub>: Ne &gt; F &gt; N &gt; O (O drops below N).</div>`],
  ['Successive ionization energies',`Each additional electron is harder to remove (you're pulling from a more positive ion). The <b>huge jump</b> comes when you start removing <b>core</b> electrons.
  <div class="key">Count the electrons before the big jump = number of valence electrons = the group.</div>
  <div class="ex">IE: 738, 1451, <b>7733</b>, 10540 kJ/mol. The jump is after IE<sub>2</sub>, so there are 2 valence electrons: group 2. In period 3 that's <b>Mg</b>.<br>K: jump between IE<sub>1</sub> and IE<sub>2</sub>. Ca: jump between IE<sub>2</sub> and IE<sub>3</sub>.</div>`]
 ]},
 {id:'ea',sec:3,sym:'Ea',n:'Electron affinity',src:'Topic 1F · Lecture 22',
  lesson:[
  ['What it is (watch the sign!)',`<b>Electron affinity (E<sub>ea</sub>)</b> is the energy <b>released</b> when a gas-phase atom gains an electron: X(g) + e⁻ → X<sup>−</sup>(g).
  <div class="key">In this course: <b>positive E<sub>ea</sub> = energy released</b> (the atom "likes" the electron). <b>Negative E<sub>ea</sub> = energy must be added</b> (the atom doesn't want it).</div>
  On the homework, the ranking went from "most energy released" to "most energy absorbed".`],
  ['The trend',`<div class="key">E<sub>ea</sub> gets more positive <b>up a group</b> and <b>left → right</b>, the same direction as IE.</div>
  Halogens (group 17) have the highest values. One more electron fills their p subshell. Cl (349 kJ/mol) is actually higher than F (328), because F is so small that the added electron is crowded.`],
  ['Exceptions (different places than for IE!)',`<ul><li><b>Noble gases:</b> negative. The electron would have to start a new shell (higher n), far away and well shielded.</li>
  <li><b>Group 2 (Be, Mg):</b> low or negative. The new electron has to go into a higher-energy p orbital.</li>
  <li><b>Group 15 (N):</b> lower than C. N's 2p is half-full, so the new electron has to pair up (repulsion). C can add one to an empty 2p and become half-full.</li></ul>
  <div class="ex">HW: Br (E<sub>ea</sub> = +325 kJ/mol) &gt; O (+141) &gt; Ne (negative). Most released → most absorbed: <b>Br, O, Ne</b>.</div>`]
 ]},
 {id:'ion',sec:3,sym:'Ib',n:'Ionic bonding',src:'Focus 2A · Lecture 23',
  lesson:[
  ['What a bond is',`A chemical bond forms when atoms together have <b>lower energy</b> than the separate atoms. In an <b>ionic</b> bond, a metal gives electrons to a nonmetal, and the + and − ions attract.
  An ionic solid is a regular 3-D stack (crystal) of cations and anions. It is <b>not</b> pairs of ions. Every cation attracts every anion, and like charges repel. The bond is a "global" property of the whole crystal.`],
  ['Which ions form',`Atoms gain or lose electrons to reach a noble-gas configuration (an <b>octet</b>).
  <ul><li>s-block metals: lose their s electrons. Na<sup>+</sup>, Mg<sup>2+</sup>, Ca<sup>2+</sup>.</li>
  <li>Nonmetals: gain electrons to fill p. O<sup>2−</sup>, S<sup>2−</sup>, Cl<sup>−</sup>, N<sup>3−</sup>.</li>
  <li>Al: loses 3, giving Al<sup>3+</sup>. Heavier p-block metals lose their p and s electrons but keep a full d<sup>10</sup>: Ga<sup>3+</sup> = [Ar]3d<sup>10</sup>.</li></ul>`],
  ['Transition metal ions: lose 4s first!',`Once 3d is occupied, 3d is lower in energy than 4s. So <b>ns electrons leave first</b>.
  <div class="ex"><b>Fe</b> = [Ar]3d<sup>6</sup>4s<sup>2</sup><br><b>Fe<sup>2+</sup></b> = [Ar]3d<sup>6</sup> (both 4s gone, not 3d<sup>4</sup>4s<sup>2</sup>)<br><b>Fe<sup>3+</sup></b> = [Ar]3d<sup>5</sup><br>Cu<sup>+</sup> = [Ar]3d<sup>10</sup>, Zn<sup>2+</sup> = [Ar]3d<sup>10</sup></div>`],
  ['Lewis symbols & formulas',`A Lewis symbol is the element symbol with one dot per valence electron (N has 5 dots, Cl has 7).
  To build an ionic formula: take away the metal's dots, give them to the nonmetal until it has 8, add atoms until the electrons balance, then write charges in brackets.
  <div class="ex">Li· + ·Cl (7 dots) → Li<sup>+</sup> [Cl with 8 dots]<sup>−</sup> = <b>LiCl</b><br>Ca has 2 dots and each Cl takes 1, so you need two Cl: <b>CaCl<sub>2</sub></b>. Al<sup>3+</sup> + O<sup>2−</sup> → <b>Al<sub>2</sub>O<sub>3</sub></b>.</div>`],
  ['Lattice energy',`Making ions costs energy (ionization energy). The ions clumping into a solid releases a lot of energy: the <b>lattice energy</b>. It must be big enough to pay for making the ions. It measures how strong the ionic bonding is.
  <div class="key">Bigger lattice energy: <b>1) higher charges first</b>, <b>2) then smaller ions</b> (closer together). Based on Coulomb: ∝ (z<sub>1</sub>·z<sub>2</sub>)/distance.</div>
  <div class="ex">MgO (2+/2−) ≫ NaF &gt; NaCl &gt; KCl &gt; KBr (all 1+/1−, ions getting bigger)</div>`]
 ]},
 {id:'lew',sec:3,sym:'Lw',n:'Lewis structures, resonance, formal charge',src:'Focus 2B · Lectures 23–24',
  lesson:[
  ['Covalent bonds',`In a covalent bond, two atoms <b>share</b> a pair of electrons, drawn as a line (−). <b>Octet rule:</b> atoms share until each has 8 valence electrons around it (H only needs 2).`],
  ['The 7-step method',`<ol><li><b>Count</b> total valence electrons (group numbers). Add 1 per negative charge, subtract 1 per positive charge.</li>
  <li><b>Central atom:</b> the one with the lowest ionization energy, usually the "lonely" atom there's only one of. Never H. F is usually terminal.</li>
  <li><b>Connect</b> every atom to the central atom with a single bond (2 e⁻ each). Arrange symmetrically.</li>
  <li><b>Distribute</b> the remaining electrons as lone pairs: fill the outer atoms' octets first, then put any extra on the central atom.</li>
  <li><b>Count:</b> does everyone have an octet? Does the total match step 1?</li>
  <li>Central atom short? <b>Move a lone pair</b> from an outer atom into a double (or triple) bond.</li>
  <li>Electrons left over? Put them on the central atom (it may go past 8, which is OK for period 3+).</li></ol>
  Practice every step in the <b>Lewis lab</b>.`],
  ['Resonance',`Sometimes several equally good structures exist that differ only in where the double bond sits (NO<sub>3</sub><sup>−</sup>, O<sub>3</sub>, benzene C<sub>6</sub>H<sub>6</sub>). The real molecule is a <b>blend</b> (resonance hybrid) of all of them, drawn with ↔ between structures.
  <div class="key">The molecule does not flip between structures. All the bonds are actually identical, with an order in between single and double. Benzene's 6 C–C bonds are all the same.</div>`],
  ['Formal charge',`Formal charge tells you which arrangement is most likely:
  <div class="key">FC = V − L − B/2<br>V = valence electrons of the free atom, L = lone-pair electrons on it, B = bonding electrons around it.<br>Shortcut: FC = V − (dots) − (lines).</div>
  <ul><li>Best structure: formal charges as close to <b>zero</b> as possible.</li>
  <li>Smaller charges beat bigger ones.</li><li>If you must have a negative FC, put it on the most electronegative atom (O, F, N).</li>
  <li>The formal charges always add up to the overall charge.</li></ul>
  <div class="ex">NCO<sup>−</sup>: [N≡C−O]<sup>−</sup> gives N 0, C 0, O −1, which is best (−1 sits on O). [N=C=O]<sup>−</sup> gives N −1. [N−C≡O]<sup>−</sup> gives N −2, O +1 (worst).</div>`]
 ]},
 {id:'oct',sec:3,sym:'Oc',n:'Beyond the octet',src:'Focus 2C · Lecture 24',
  lesson:[
  ['Who follows the rule',`<div class="key"><b>C, N, O, F always obey the octet rule</b>. They never go past 8, because period 2 has no d orbitals.</div>
  Others can break it in three ways: odd electrons, expanded octets, incomplete octets.`],
  ['Odd number of electrons (radicals)',`If the total valence count is odd, someone has to have an unpaired electron. These molecules are <b>radicals</b>. Examples: NO (11 e⁻), NO<sub>2</sub> (17 e⁻), ClO<sub>2</sub>.`],
  ['Expanded octets (period 3 and below)',`P, S, Cl, Br, I, Xe… have empty d orbitals available, so the central atom can hold <b>more than 8</b> electrons. Molecules like this are called <b>hypervalent</b>.
  <div class="ex">I<sub>3</sub><sup>−</sup>: 22 e⁻. Central I has 2 bonds + 3 lone pairs = 10 e⁻, FC −1.<br>SF<sub>4</sub>: 34 e⁻. S has 4 bonds + 1 lone pair = 10 e⁻.<br>SF<sub>6</sub>: S has 12 e⁻. XeF<sub>4</sub>: Xe has 4 bonds + 2 lone pairs.<br>ClO<sub>4</sub><sup>−</sup>: the all-single version gives Cl a +3 formal charge. Using 3 Cl=O double bonds drops Cl to 0, which is better, so the expanded octet wins.</div>`],
  ['Incomplete octets (group 13, Be)',`Boron is happy with only 6 electrons.
  <div class="ex">BF<sub>3</sub>: three single bonds, B has 6 e⁻, all FC = 0. A B=F double bond would give F a +1 formal charge. F is the most electronegative element, so that's unfavorable. The single-bond structure wins.</div>`]
 ]},
];

TOPICS.push(
 {id:'yld',sec:2,sym:'Ly',n:'Limiting reagent & yield',src:'Fundamentals M',
  lesson:[
  ['The recipe',`A balanced equation is a recipe in <b>moles</b>. Always: grams → moles → use coefficients → moles → grams.`],
  ['Limiting reagent',`The reactant that runs out first. For each reactant, compute how much product it <i>could</i> make. The <b>smallest</b> amount wins, and that reactant is limiting.
  <div class="ex">N<sub>2</sub> + 3H<sub>2</sub> → 2NH<sub>3</sub>, with 28.0 g N<sub>2</sub> (1.00 mol) and 9.0 g H<sub>2</sub> (4.46 mol).<br>N<sub>2</sub> could make 2.00 mol NH<sub>3</sub>. H<sub>2</sub> could make 4.46 × 2/3 = 2.98 mol. <b>N<sub>2</sub> is limiting</b>, giving 2.00 mol × 17.03 = 34.1 g NH<sub>3</sub>.<br>H<sub>2</sub> used: 3.00 mol, so 1.46 mol (2.95 g) is left over in excess.</div>`],
  ['Percent yield',`<div class="key">% yield = actual ÷ theoretical × 100</div>
  Theoretical yield = the amount the limiting reagent allows. Actual yield = what you really got.`]
 ]},
 {id:'lit',sec:2,sym:'Em',n:'Light & atomic spectra',src:'Focus 1A',
  lesson:[
  ['What light is',`Electromagnetic radiation: oscillating electric and magnetic fields, all moving at <b>c = 3.00×10<sup>8</sup> m/s</b> in vacuum, whatever the frequency.
  <div class="key">c = λν &nbsp;&nbsp; E = hν = hc/λ</div>
  Short wavelength = high frequency = high energy. Amplitude is brightness (intensity), not energy per photon.
  <div class="ex">Spectrum, low → high energy: radio, microwave, IR, <b>visible (700 nm red → 400 nm violet)</b>, UV, X-ray, gamma.</div>`],
  ['Hydrogen spectrum',`An H atom only has certain energy levels, so it only absorbs or emits certain wavelengths (lines). <b>Emission</b>: the electron drops from a high n to a low n and gives off a photon. It does <b>not</b> leave the atom.
  <div class="key">Rydberg: ν = R(1/n<sub>1</sub><sup>2</sup> − 1/n<sub>2</sub><sup>2</sup>), R = 3.29×10<sup>15</sup> Hz, then λ = c/ν.</div>
  <div class="ex">n = 5 → 1: ν = 3.29×10<sup>15</sup>(1 − 1/25) = 3.16×10<sup>15</sup> Hz, so λ = 95.0 nm (UV).</div>
  Energy levels get <b>closer together</b> as n increases.`],
  ['Per-mole energy',`E for one photon = hc/λ. For a mole of photons, multiply by N<sub>A</sub>.
  <div class="ex">λ = 101.6 nm: E = (6.626×10<sup>−34</sup>)(3.00×10<sup>8</sup>)/(101.6×10<sup>−9</sup>) = 1.96×10<sup>−18</sup> J. × 6.022×10<sup>23</sup> = 1.18 MJ.</div>`]
 ]},
 {id:'qua',sec:2,sym:'Qp',n:'Photons, matter waves, uncertainty',src:'Focus 1B',
  lesson:[
  ['Photoelectric effect',`Light comes in packets (photons) with E = hν. An electron is ejected only if <b>one photon</b> has at least the threshold energy.
  <div class="key">Below threshold: no electrons, however bright the light. Above threshold: brighter light gives <b>more</b> electrons, not faster ones. Higher frequency gives faster ones.</div>
  <div class="ex">Threshold 3.89×10<sup>−19</sup> J corresponds to λ = hc/E = 511 nm (green). Green and anything shorter (blue, indigo, violet) works.</div>`],
  ['Matter waves (de Broglie)',`Particles act like waves too: <div class="key">λ = h/(mv)</div>Heavy or fast objects have a tiny λ, which is why a baseball doesn't diffract.
  <div class="ex">Neutron with λ = 6.54 µm: v = h/(mλ) = 6.626×10<sup>−34</sup>/(1.67×10<sup>−27</sup> × 6.54×10<sup>−6</sup>) = 0.0607 m/s.</div>`],
  ['Uncertainty principle',`You can't know both position and momentum exactly at the same time.
  <div class="key">Δp·Δx ≥ h/(4π), with Δp = mΔv</div>
  <div class="ex">Electron, Δv = 1×10<sup>4</sup> m/s: Δx ≥ 6.626×10<sup>−34</sup>/(4π × 9.109×10<sup>−31</sup> × 1×10<sup>4</sup>) = 5.8 nm.</div>`]
 ]},
 {id:'orb',sec:2,sym:'Or',n:'Orbitals & quantum numbers',src:'Focus 1C–1D',
  lesson:[
  ['Quantum numbers',`<div class="key">n = 1, 2, 3… (shell, size/energy)<br>l = 0 … n−1 (shape: 0 = s, 1 = p, 2 = d, 3 = f)<br>m<sub>l</sub> = −l … +l (orientation, so 2l+1 orbitals)<br>m<sub>s</sub> = +½ or −½ (spin)</div>
  A shell n has n<sup>2</sup> orbitals and 2n<sup>2</sup> electrons. A p subshell has 3 orbitals (6 e⁻), d has 5 (10 e⁻).`],
  ['Nodes',`<div class="key">Radial nodes = n − l − 1 &nbsp;&nbsp; Angular nodes = l</div>
  <div class="ex">3p: radial 3−1−1 = 1, angular 1. 2s: 1 radial node. 3d: 0 radial, 2 angular.</div>
  On a radial distribution plot, the number of humps = radial nodes + 1.`],
  ['Hydrogen energy levels',`<div class="key">E<sub>n</sub> = −hR/n<sup>2</sup> = −2.18×10<sup>−18</sup> J / n<sup>2</sup></div>
  In H only, every orbital with the same n has the same energy (degenerate): 2s = 2p.
  <div class="ex">E = −5.45×10<sup>−19</sup> J: 2.18×10<sup>−18</sup>/5.45×10<sup>−19</sup> = 4 = n<sup>2</sup>, so n = 2. The electron is in the 2s, 2p<sub>x</sub>, 2p<sub>y</sub>, <b>or</b> 2p<sub>z</sub> orbital (only one at a time!).</div>`],
  ['What an orbital is',`An orbital is a 3-D standing wave. Its shape shows where the electron is likely to be found. The electron doesn't "hop" between lobes. It's a single wave spread over all of them.`]
 ]},
 {id:'unt',sec:1,sym:'Un',n:'Units, sig figs, conversions',src:'Fundamentals A',

  ['Significant figures',`Leading zeros don't count (0.00450 has 3). Trailing zeros after a decimal do count. ×/÷: keep the fewest sig figs. +/−: keep the fewest decimal places. A measurement is read to one estimated digit past the smallest marking.`],
  ['Accuracy vs precision',`Accuracy = how close to the true value. Precision = how close repeated measurements are to each other.`]

 {id:'mol',sec:1,sym:'Mo',n:'Moles, formulas, mass %',src:'Fundamentals E–F, L',

 {id:'atm',sec:1,sym:'At',n:'Atoms, isotopes, compounds & names',src:'Fundamentals B–D',
  lesson:[

 {id:'bnd',sec:3,sym:'Bp',n:'Bond properties: electronegativity, strength, length',src:'Focus 2D · upcoming lectures',
  lesson:[
  ['Electronegativity and polar bonds',`<b>Electronegativity (χ)</b> = how hard an atom pulls on shared electrons in a bond. It increases left → right and up a group. <b>F is highest (3.98)</b>, then O (3.44), Cl (3.16), N (3.04). Cs is lowest.
  When two different atoms bond, the more electronegative one gets a partial negative charge: δ+H–Clδ−. That's a <b>polar covalent bond</b>. Identical atoms (Cl<sub>2</sub>, O<sub>2</sub>) make nonpolar bonds.
  <div class="key">Δχ ≈ 2 or more → ionic. Δχ below about 1.5 → covalent (polar if Δχ &gt; 0).</div>
  <div class="ex">NaCl: 3.16 − 0.93 = 2.23 → ionic. C–O: 3.44 − 2.55 = 0.89 → polar covalent. Mg–Cl: 1.85 → lots of ionic character.</div>
  Dipole moment μ is measured in debye (D). HCl ≈ 1.1 D.`],
  ['Polarizability (covalent character in ionic bonds)',`A cation pulls the anion's electron cloud toward itself, adding covalent character.
  <ul><li><b>Large anions are highly polarizable</b> (I<sup>−</sup> ≫ F<sup>−</sup>).</li><li><b>Small, highly charged cations have high polarizing power</b> (Al<sup>3+</sup>, Be<sup>2+</sup>, Li<sup>+</sup>).</li>
  <li>Polarizing power rises across a period (Li<sup>+</sup> &lt; Be<sup>2+</sup>) and falls down a group (Li<sup>+</sup> &gt; Na<sup>+</sup>).</li></ul>`],
  ['Bond strength and bond length',`<b>Bond strength</b> = dissociation energy D (the energy to pull the bonded atoms apart).
  <div class="key">Higher bond order → stronger and shorter. For the same two atoms: triple &gt; double &gt; single in strength; triple &lt; double &lt; single in length.</div>
  <div class="ex">N≡N 944 &gt; O=O 496 &gt; F–F 158 kJ/mol. C–C 154 pm &gt; C=C 134 &gt; C≡C 120 pm. Benzene C–C = 139 pm (resonance average).</div>
  A double bond is <b>not</b> twice as strong as a single bond (C=C 612 vs 2 × 348). Bigger atoms make longer, weaker bonds: H–F &gt; H–Cl &gt; H–Br &gt; H–I in strength. <b>Covalent radius</b> = an atom's share of a bond length (C 77 + Cl 99 ≈ 176 pm for C–Cl).`]
 ]},
