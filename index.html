const NOTES=[{"id": "intro", "t": "How to use these notes", "h": "How to use these notes", "html": "<p>The final (Sat Dec 5, multiple choice, 2 h 50 min) has three sections: <strong>Section 1</strong> = Midterm 1 material, <strong>Section 2</strong> = Midterm 2 material, <strong>Section 3</strong> = everything after Midterm 2. A higher score on section 1 or 2 replaces that midterm score (yours: 76% and 80%). These notes put the new material first because you haven't been tested on it yet.</p>\n<div class=\"scroll\"><table class=\"nt\">\n<thead>\n<tr>\n<th>Final section</th>\n<th>Textbook</th>\n<th>Lectures</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>3 (new)</td>\n<td>Topics 1E, 1F, 2A, 2B, 2C (+ 2D, 2E if covered in this week's lectures)</td>\n<td>20–24 and later</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Fundamentals M, Topics 1A–1D</td>\n<td>Before Midterm 2</td>\n</tr>\n<tr>\n<td>1</td>\n<td>Fundamentals A–I and L</td>\n<td>Before Midterm 1</td>\n</tr>\n</tbody>\n</table></div>\n<p>Two conventions to keep straight:</p>\n<ul>\n<li><strong>Electron affinity sign:</strong> in this course and textbook, a <em>positive</em> Eea means energy is <em>released</em> when the atom gains an electron.</li>\n<li><strong>Valence electrons:</strong> everything after the noble-gas core, <em>except</em> a full subshell with a lower n (for example, the 3d¹⁰ in Ga counts as core).</li>\n</ul>\n<p>Fundamentals J (acids and bases) and K (redox) are in the textbook pages but were not on the Midterm 1 guide, so they get only a short mention.</p>", "words": 182}, {"id": "1E", "t": "Topic 1E · Many-electron atoms", "h": "Topic 1E: Many-electron atoms (Lectures 20–21)", "html": "<p>In atoms with more than one electron, orbitals with the same n no longer have the same energy: for a given n, <strong>s &lt; p &lt; d &lt; f</strong>. This energy order decides how electrons fill the orbitals and explains the shape of the periodic table.</p>\n<h3>1E.1 Orbital energies</h3>\n<ul>\n<li><strong>Hydrogen is special.</strong> It has one electron, so every orbital in a shell is degenerate (2s = 2p; 3s = 3p = 3d).</li>\n<li><strong>More protons lower every orbital.</strong> A higher nuclear charge Z pulls all electrons in harder.</li>\n<li><strong>Electrons repel each other.</strong> Each electron is less tightly bound than it would be alone, because the others partly cancel the nucleus's pull. This is <strong>shielding</strong>.</li>\n<li><strong>Effective nuclear charge (Zeff)</strong> = the net charge an electron actually feels. It is always less than Z. Example from lecture: in He (Z = 2), a 1s electron feels Zeff ≈ 1.69.</li>\n<li><strong>Penetration.</strong> An s electron has a nonzero chance of being right at the nucleus, so it slips inside the inner shells and is less shielded. A p electron has a node at the nucleus and penetrates less; d and f even less.</li>\n<li>Result, for the same n: s is lowest, then p, d, f. That's why 4s fills before 3d.</li>\n</ul>\n<div class=\"formula\">Z<sub>eff</sub> &lt; Z &nbsp;·&nbsp; rough estimate: Z<sub>eff</sub> ≈ Z − (number of core electrons)</div>\n\n<h3>1E.2 The building-up (Aufbau) principle</h3>\n<p>The ground-state configuration fills orbitals from lowest energy up, following two rules.</p>\n<ol>\n<li><strong>Pauli exclusion principle:</strong> no two electrons in an atom have the same four quantum numbers. So an orbital holds at most <strong>2 electrons, with paired (opposite) spins</strong>: s holds 2, p holds 6, d holds 10, f holds 14.</li>\n<li><strong>Hund's rule:</strong> in degenerate orbitals (like the three 2p), electrons go in <strong>singly with parallel spins</strong> before any pairing. That minimizes repulsion.</li>\n</ol>\n<p>Filling order: 1s 2s 2p 3s 3p <strong>4s 3d</strong> 4p 5s 4d 5p 6s 4f 5d 6p 7s 5f 6d. Shortcut: read the periodic table left to right, row by row (s block = 2 wide, d block = 10, p block = 6, f block = 14).</p>\n<p><strong>How to write a configuration (worked examples):</strong></p>\n<div class=\"scroll\"><table class=\"nt\">\n<thead>\n<tr>\n<th>Atom</th>\n<th>Electrons</th>\n<th>Full configuration</th>\n<th>Short form</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>C</td>\n<td>6</td>\n<td>1s² 2s² 2p²</td>\n<td>[He]2s²2p² (2 unpaired)</td>\n</tr>\n<tr>\n<td>N</td>\n<td>7</td>\n<td>1s² 2s² 2p³</td>\n<td>[He]2s²2p³ (3 unpaired)</td>\n</tr>\n<tr>\n<td>S</td>\n<td>16</td>\n<td>1s² 2s² 2p⁶ 3s² 3p⁴</td>\n<td>[Ne]3s²3p⁴</td>\n</tr>\n<tr>\n<td>Fe</td>\n<td>26</td>\n<td>… 4s² 3d⁶</td>\n<td>[Ar]3d⁶4s²</td>\n</tr>\n<tr>\n<td>Se</td>\n<td>34</td>\n<td>… 4s² 3d¹⁰ 4p⁴</td>\n<td>[Ar]3d¹⁰4s²4p⁴</td>\n</tr>\n</tbody>\n</table></div>\n<p>Steps: (1) count electrons = Z, (2) write the previous noble gas in brackets, (3) fill what's left in order, (4) for p or d, use Hund's rule to count unpaired electrons.</p>\n<p><strong>Exceptions you must know</strong> (about 25% of elements deviate somehow, but these are the testable ones). A half-full (d⁵) or full (d¹⁰) d subshell is extra stable, so one s electron moves into d:</p>\n<ul>\n<li><strong>Cr</strong> = [Ar]3d⁵4s¹ (not 3d⁴4s²), and <strong>Mo</strong> below it</li>\n<li><strong>Cu</strong> = [Ar]3d¹⁰4s¹ (not 3d⁹4s²), and <strong>Ag</strong> below it</li>\n</ul>\n<h3>Core vs. valence electrons</h3>\n<ul>\n<li><strong>Core electrons</strong> are inner, close to the nucleus, and unreactive.</li>\n<li><strong>Valence electrons</strong> are outer and do the reacting. Course definition: all electrons after the noble-gas configuration, except electrons in a closed subshell with a lower principal quantum number.</li>\n</ul>\n<div class=\"scroll\"><table class=\"nt\">\n<thead>\n<tr>\n<th>Configuration</th>\n<th>Core</th>\n<th>Valence</th>\n<th>Count</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>B: [He]2s²2p¹</td>\n<td>[He]</td>\n<td>2s²2p¹</td>\n<td>3</td>\n</tr>\n<tr>\n<td>Ti: [Ar]3d²4s²</td>\n<td>[Ar]</td>\n<td>3d²4s² (3d not full)</td>\n<td>4</td>\n</tr>\n<tr>\n<td>Ga / Se / Br: [Ar]3d¹⁰4s²4pˣ</td>\n<td>[Ar]3d¹⁰</td>\n<td>4s and 4p</td>\n<td>3 / 6 / 7</td>\n</tr>\n<tr>\n<td>Bi: [Xe]4f¹⁴5d¹⁰6s²6p³</td>\n<td>[Xe]4f¹⁴5d¹⁰</td>\n<td>6s²6p³</td>\n<td>5</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Traps:</strong> (1) In hydrogen, 2s = 2p; in every other atom, 2s &lt; 2p. (2) Ground state vs. excited state: 1s²2s¹2p¹ for Be is excited (2s isn't full yet). (3) Transition-metal ions lose 4s electrons first (see 2A).</p>", "words": 597}, {"id": "1F", "t": "Topic 1F · Periodicity", "h": "Topic 1F: Periodicity (Lectures 21–22)", "html": "<p>Every periodic trend comes back to two things: <strong>Zeff</strong> (it rises across a period) and <strong>n</strong> (it rises down a group). Radius goes one way; ionization energy and electron affinity go the other.</p>\n<div class=\"scroll\"><table class=\"nt\">\n<thead>\n<tr>\n<th>Property</th>\n<th>Across a period (→)</th>\n<th>Down a group (↓)</th>\n<th>Biggest / highest</th>\n<th>Main exceptions</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Atomic radius</td>\n<td>Decreases</td>\n<td>Increases</td>\n<td>Bottom-left (Cs)</td>\n<td>Few</td>\n</tr>\n<tr>\n<td>Ionization energy (I₁)</td>\n<td>Increases</td>\n<td>Decreases</td>\n<td>Top-right (He, Ne, F)</td>\n<td>Be &gt; B, N &gt; O (also Mg &gt; Al, P &gt; S)</td>\n</tr>\n<tr>\n<td>Electron affinity (Eea)</td>\n<td>Becomes more positive</td>\n<td>Becomes less positive</td>\n<td>Group 17 (Cl &gt; F)</td>\n<td>Group 2, group 15 (N), noble gases</td>\n</tr>\n<tr>\n<td>Zeff on valence e⁻</td>\n<td>Increases</td>\n<td>Changes little</td>\n<td>—</td>\n<td>—</td>\n</tr>\n</tbody>\n</table></div>\n<h3>1F.1 The general structure of the periodic table</h3>\n<ul>\n<li><strong>s and p blocks</strong> = the main groups. <strong>d block</strong> = transition metals. <strong>f block</strong> = lanthanides and actinides.</li>\n<li>The table was built from experimental patterns long before anyone knew about electron structure. Zeff and electron configurations now explain those patterns.</li>\n</ul>\n<h3>1F.2 Atomic radius</h3>\n<ul>\n<li>Atomic radius = half the distance between neighboring atom centers (in a solid for metals, in a molecule for nonmetals). Example: Cl–Cl is 198 pm, so the radius of Cl is 99 pm.</li>\n<li><strong>Across a period:</strong> the core stays the same while protons and valence electrons are added. Zeff rises, so the cloud is pulled in and the radius <strong>decreases</strong>.</li>\n<li><strong>Down a group:</strong> each new period starts a new shell (higher n), farther out, so the radius <strong>increases</strong>.</li>\n</ul>\n<h3>1F.3 Ionic radius</h3>\n<p>Ionic radius = an ion's share of the distance between neighboring ions in an ionic solid.</p>\n<ul>\n<li><strong>Cations are smaller than their parent atoms.</strong> Losing the valence electrons often empties the outer shell entirely (Na: [Ne]3s¹ → Na⁺: [Ne]). The same protons also pull on fewer electrons.</li>\n<li><strong>Anions are larger than their parent atoms.</strong> Same protons, more electrons, more e⁻–e⁻ repulsion.</li>\n<li><strong>Isoelectronic</strong> species have the same number of electrons. In an isoelectronic series, more protons means a smaller ion.</li>\n</ul>\n<p>Worked example (all 10 e⁻, the [Ne] configuration), largest to smallest:</p>\n<p>N³⁻ (7 p) &gt; O²⁻ (8 p) &gt; F⁻ (9 p) &gt; Na⁺ (11 p) &gt; Mg²⁺ (12 p) &gt; Al³⁺ (13 p)</p>\n<p>Another series (18 e⁻, the [Ar] configuration): S²⁻ &gt; Cl⁻ &gt; K⁺ &gt; Ca²⁺.</p>\n<h3>1F.4 Ionization energy</h3>\n<p><strong>Ionization energy (I)</strong> = the minimum energy to remove an electron from an atom in the gas phase. It is always positive (energy goes in).</p>\n<div class=\"formula\">Li(g) → Li⁺(g) + e⁻ &nbsp; I₁ = 519 kJ/mol &nbsp;·&nbsp; Li⁺(g) → Li²⁺(g) + e⁻ &nbsp; I₂ = 7300 kJ/mol</div>\n\n<ul>\n<li><strong>Trend:</strong> increases up a group (electron is closer, held tighter) and left to right (Zeff rises).</li>\n<li><strong>Successive ionization energies always increase</strong> (I₁ &lt; I₂ &lt; I₃…) because each electron leaves a more positive ion.</li>\n<li><strong>The huge jump</strong> comes when you start removing core electrons. The number of electrons before the jump = the number of valence electrons = the group.</li>\n</ul>\n<div class=\"scroll\"><table class=\"nt\">\n<thead>\n<tr>\n<th>Element</th>\n<th>I₁</th>\n<th>I₂</th>\n<th>I₃</th>\n<th>I₄</th>\n<th>Jump after</th>\n<th>Group</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Na</td>\n<td>494</td>\n<td>4562</td>\n<td>6910</td>\n<td>9543</td>\n<td>I₁</td>\n<td>1</td>\n</tr>\n<tr>\n<td>Mg</td>\n<td>738</td>\n<td>1451</td>\n<td>7733</td>\n<td>10 540</td>\n<td>I₂</td>\n<td>2</td>\n</tr>\n<tr>\n<td>Al</td>\n<td>578</td>\n<td>1817</td>\n<td>2745</td>\n<td>11 577</td>\n<td>I₃</td>\n<td>13</td>\n</tr>\n</tbody>\n</table></div>\n<p>(Values in kJ/mol. The Mg row is the homework question.)</p>\n<p><strong>The two exceptions, and why:</strong></p>\n<ul>\n<li><strong>Be (900) &gt; B (799):</strong> B's outer electron is in 2p, which is higher in energy and more shielded than 2s, so it's easier to remove. Same for Mg &gt; Al.</li>\n<li><strong>N (1400) &gt; O (1310):</strong> O is 2p⁴, so one 2p orbital holds a pair. The repulsion within that pair makes one of those electrons easier to remove. N is 2p³, all unpaired. Same for P &gt; S.</li>\n<li>Period 2 order of I₁: Li &lt; B &lt; Be &lt; C &lt; O &lt; N &lt; F &lt; Ne.</li>\n</ul>\n<h3>1F.5 Electron affinity</h3>\n<p><strong>Electron affinity (Eea)</strong> = the energy <strong>released</strong> when an electron attaches to a gas-phase atom: X(g) + e⁻ → X⁻(g).</p>\n<ul>\n<li><strong>Positive Eea</strong> = energy released (the atom wants the electron). <strong>Negative Eea</strong> = energy must be put in.</li>\n<li><strong>Trend:</strong> more positive up a group and left to right, the same direction as IE. Halogens are highest.</li>\n<li><strong>Cl (349) &gt; F (328):</strong> F is so small that the added electron is crowded by the others.</li>\n<li>Selected values (kJ/mol): H +73, Li +60, C +122, N −7, O +141, F +328, Na +53, Si +134, P +72, S +200, Cl +349, Br +325, I +295. Noble gases and Be, Mg are ≤ 0.</li>\n</ul>\n<p><strong>EA exceptions are in different places than the IE ones</strong> (a likely exam question):</p>\n<ul>\n<li><strong>Noble gases:</strong> negative. The added electron would have to start a new shell (higher n), far from the nucleus and well shielded.</li>\n<li><strong>Group 2 (Be, Mg):</strong> low or negative. The electron must go into a higher-energy p orbital.</li>\n<li><strong>Group 15 (N &lt; C):</strong> N's half-full 2p means the added electron must pair (repulsion). C adds into an empty 2p.</li>\n<li><strong>Second electron affinities are negative.</strong> O⁻ repels a second electron: Eea₂(O) ≈ −844 kJ/mol. Forming O²⁻ costs energy overall, and the lattice energy in a solid pays for it (see 2A).</li>\n</ul>\n<p>Homework check: most energy released → most absorbed = <strong>Br, O, Ne</strong>.</p>\n<h3>1F.6 The inert-pair effect</h3>\n<p>Heavy p-block elements tend to form ions <strong>two units lower in charge</strong> than the group number predicts, because their valence s electrons are low in energy and stay on (a \"lazy pair\").</p>\n<ul>\n<li>In⁺ alongside In³⁺; Tl⁺; Sn²⁺ alongside Sn⁴⁺; <strong>Pb²⁺</strong> (PbO is favored over PbO₂).</li>\n<li>It is strongest for the heaviest members of a group (poor shielding by d and f electrons).</li>\n</ul>\n<h3>1F.7 Diagonal relationships</h3>\n<p>Diagonal neighbors in the main groups have similar properties, because the trends run diagonally across the table: Li–Mg (both form nitrides with N₂), Be–Al (both react with acids and bases), B–Si. The metalloid staircase is a diagonal band.</p>\n<h3>1F.8 General properties</h3>\n<ul>\n<li><strong>Metals</strong> (left, bottom): low IE, lose electrons, form cations, conduct electricity. s-block metals are the most reactive.</li>\n<li><strong>Nonmetals</strong> (top right): high IE and Eea, gain electrons, form anions or covalent bonds.</li>\n<li><strong>Metalloids</strong> (B, Si, Ge, As, Sb, Te) sit on the diagonal border between them.</li>\n</ul>", "words": 994}, {"id": "2A", "t": "Topic 2A · Ionic bonding", "h": "Topic 2A: Ionic bonding (Lecture 23)", "html": "<p>An ionic solid forms because the attraction between the packed-together ions (the <strong>lattice energy</strong>) more than pays back the energy needed to make the ions. For NaCl: +494 (ionize Na) − 349 (Cl gains e⁻) = +145 kJ/mol to make the ions, then −787 kJ/mol when they form the solid. Net: −642 kJ/mol, a large drop in energy.</p>\n<p><strong>A chemical bond</strong> forms when the arrangement of nuclei and electrons together has lower energy than the separate atoms. In the ionic model, a metal transfers electrons to a nonmetal. <strong>Ionic solid</strong> = cations and anions stacked in a regular 3-D array (a crystalline solid).</p>\n<h3>2A.1 The ions that elements form</h3>\n<p>Atoms gain or lose electrons to reach a noble-gas configuration, usually an <strong>octet</strong> (ns²np⁶).</p>\n<ul>\n<li><strong>s-block metals</strong> lose their s electrons: Na⁺, Mg²⁺, Ca²⁺. Al (period 3 p-block metal) loses 3: Al³⁺.</li>\n<li><strong>p-block nonmetals</strong> gain electrons to fill the p subshell: N³⁻, O²⁻, S²⁻, F⁻, Cl⁻.</li>\n<li><strong>p-block metals in period 4 and below</strong> lose their p and s electrons but keep the full (n−1)d¹⁰: Ga³⁺ = [Ar]3d¹⁰. Heavier ones can also lose only the p electrons (the inert-pair effect, 1F.6): Tl⁺, Sn²⁺, Pb²⁺.</li>\n<li><strong>d-block metals lose ns electrons first.</strong> Once 3d is occupied, it is lower in energy than 4s, so cations lose 4s before 3d.</li>\n</ul>\n<div class=\"scroll\"><table class=\"nt\">\n<thead>\n<tr>\n<th>Ion</th>\n<th>Neutral atom</th>\n<th>Ion configuration</th>\n<th>Common mistake</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Fe²⁺</td>\n<td>[Ar]3d⁶4s²</td>\n<td>[Ar]3d⁶</td>\n<td>[Ar]3d⁴4s²</td>\n</tr>\n<tr>\n<td>Fe³⁺</td>\n<td>[Ar]3d⁶4s²</td>\n<td>[Ar]3d⁵</td>\n<td>[Ar]3d³4s²</td>\n</tr>\n<tr>\n<td>Cu⁺</td>\n<td>[Ar]3d¹⁰4s¹</td>\n<td>[Ar]3d¹⁰</td>\n<td>[Ar]3d⁹4s¹</td>\n</tr>\n<tr>\n<td>Cu²⁺</td>\n<td>[Ar]3d¹⁰4s¹</td>\n<td>[Ar]3d⁹</td>\n<td>[Ar]3d⁸4s¹</td>\n</tr>\n<tr>\n<td>Zn²⁺</td>\n<td>[Ar]3d¹⁰4s²</td>\n<td>[Ar]3d¹⁰</td>\n<td>[Ar]3d⁸4s²</td>\n</tr>\n<tr>\n<td>Mn²⁺</td>\n<td>[Ar]3d⁵4s²</td>\n<td>[Ar]3d⁵</td>\n<td>[Ar]3d³4s²</td>\n</tr>\n</tbody>\n</table></div>\n<p>Shortcut for any 3d-metal ion: d-count = (Z − 18) − charge, and no 4s electrons.</p>\n<h3>2A.2 Lewis symbols</h3>\n<ul>\n<li>The element symbol plus <strong>one dot per valence electron</strong>. A single dot = an electron alone in an orbital; a pair of dots = two paired electrons sharing an orbital.</li>\n<li>Period 2: Li· (1), Be (2), B (3), C (4), N (5), O (6), F (7), Ne (8).</li>\n<li><strong>Cation:</strong> remove the metal's dots. <strong>Anion:</strong> transfer those dots to the nonmetal until it has 8. Put the anion in brackets with its charge as a superscript.</li>\n</ul>\n<p>To get an ionic formula with Lewis symbols: (1) write the cation's symbol, (2) write the anion's, (3) adjust the number of each until every dot the metal gives away is taken, (4) write charges in brackets.</p>\n<ul>\n<li>Li + Cl → Li⁺ [Cl, 8 dots]⁻ = <strong>LiCl</strong></li>\n<li>Ca has 2 dots and each Cl takes 1, so two Cl are needed: Ca²⁺ 2[Cl]⁻ = <strong>CaCl₂</strong></li>\n<li>Al³⁺ and O²⁻: charges must cancel, 2(+3) = 3(−2), so <strong>Al₂O₃</strong></li>\n</ul>\n<h3>2A.3 The energetics of ionic bond formation</h3>\n<p>Imagine the process in three steps:</p>\n<ol>\n<li>Gaseous metal atoms lose electrons and form cations. This <strong>costs</strong> the ionization energy.</li>\n<li>The electrons attach to gaseous nonmetal atoms and form anions. This <strong>releases</strong> the electron affinity (or costs energy, for O²⁻).</li>\n<li>The gaseous ions clump together into a crystal. This <strong>releases</strong> the lattice energy.</li>\n</ol>\n<div class=\"scroll\"><table class=\"nt\">\n<thead>\n<tr>\n<th>Step (NaCl)</th>\n<th>Energy (kJ/mol)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Na(g) → Na⁺(g) + e⁻</td>\n<td>+494 (required)</td>\n</tr>\n<tr>\n<td>Cl(g) + e⁻ → Cl⁻(g)</td>\n<td>−349 (released)</td>\n</tr>\n<tr>\n<td>Na⁺(g) + Cl⁻(g) → NaCl(s)</td>\n<td>−787 (released, the lattice energy)</td>\n</tr>\n<tr>\n<td>Overall</td>\n<td>−642</td>\n</tr>\n</tbody>\n</table></div>\n<p>The main energy cost is the metal's ionization energy. That's why ionic compounds form only with metals: only metals have IE low enough to be paid back.</p>\n<h3>2A.4 Interactions between ions</h3>\n<ul>\n<li><strong>Lattice energy</strong> = the energy released when the gaseous ions form the solid. It measures the strength of the ionic bonding.</li>\n<li>An ionic solid is <strong>not</strong> held together by bonds between specific pairs of ions. Every cation attracts every anion, cations repel cations, and anions repel anions. The ionic bond is a \"global\" property of the whole crystal.</li>\n<li>Strong attractions explain why ionic solids have <strong>high melting points</strong> and are <strong>brittle</strong>: a blow pushes like charges next to each other, they repel, and the crystal shatters.</li>\n<li>Strength comes from the Coulomb interaction:</li>\n</ul>\n<div class=\"formula\">E<sub>p</sub> ∝ z₁z₂ / r₁₂</div>\n\n<p><strong>Comparing lattice energies:</strong> look at <strong>charge first</strong>, then <strong>size</strong> (smaller ions sit closer, so the attraction is stronger).</p>\n<ul>\n<li>MgO (2+, 2−) ≫ NaF &gt; NaCl &gt; KCl &gt; KBr (all 1+, 1−; ions get bigger)</li>\n<li>LiF &gt; LiI (F⁻ is smaller than I⁻)</li>\n<li>CaO &gt; CaS; MgO &gt; CaO</li>\n</ul>", "words": 681}, {"id": "2B", "t": "Topic 2B · Covalent bonding", "h": "Topic 2B: Covalent bonding (Lectures 23–24)", "html": "<p>A covalent bond is a <strong>shared pair of electrons</strong>, drawn as a line (–). Lewis structures show how atoms share pairs so each reaches an octet. When one structure isn't enough you blend several (resonance), and you use formal charge to choose among possible arrangements.</p>\n<h3>2B.1 Lewis structures</h3>\n<ul>\n<li><strong>Octet rule:</strong> in covalent bonding, atoms go as far as possible toward an octet (ns²np⁶, 8 electrons) by sharing pairs. <strong>H needs only 2</strong> (a duplet).</li>\n<li><strong>Bonding pair</strong> = a shared pair (a line). <strong>Lone pair</strong> = a pair on one atom, not shared (two dots).</li>\n<li><strong>Bond order</strong> = number of shared pairs: single 1, double 2, triple 3.</li>\n<li>Example: each F has 7 valence electrons. Sharing one pair gives F–F, and each F now \"counts\" 8 (3 lone pairs + the shared pair).</li>\n</ul>\n<p><strong>The valence-electron count method (from lecture):</strong></p>\n<ol>\n<li><strong>Count</strong> all valence electrons. Add 1 for each negative charge; subtract 1 for each positive charge.</li>\n<li><strong>Pick the central atom:</strong> the one with the <strong>lowest ionization energy</strong>, usually the \"lonely\" atom there's only one of. H and F are always terminal.</li>\n<li><strong>Connect</strong> each outer atom to the central atom with a single bond (2 e⁻ each). Arrange atoms symmetrically.</li>\n<li><strong>Distribute</strong> the remaining electrons as lone pairs: fill the outer atoms' octets first, then put any extra on the central atom.</li>\n<li><strong>Count:</strong> does everyone have an octet? Does the electron total match step 1?</li>\n<li><strong>Incomplete octet on the central atom?</strong> Move a lone pair from an outer atom into a double bond (or a triple bond).</li>\n<li><strong>Leftover electrons?</strong> Put them on the central atom as lone pairs, even if it goes past 8 (allowed for period 3+; see 2C).</li>\n</ol>\n<div class=\"scroll\"><table class=\"nt\">\n<thead>\n<tr>\n<th>Molecule</th>\n<th>Valence e⁻</th>\n<th>Final structure</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>NH₄⁺</td>\n<td>5 + 4 − 1 = 8</td>\n<td>N in the middle, 4 N–H bonds, no lone pairs</td>\n</tr>\n<tr>\n<td>CO₂</td>\n<td>4 + 12 = 16</td>\n<td>O=C=O, 2 lone pairs on each O</td>\n</tr>\n<tr>\n<td>HCN</td>\n<td>1 + 4 + 5 = 10</td>\n<td>H–C≡N:, 1 lone pair on N</td>\n</tr>\n<tr>\n<td>CH₂O</td>\n<td>4 + 2 + 6 = 12</td>\n<td>C central, C=O, 2 lone pairs on O</td>\n</tr>\n<tr>\n<td>H₂O</td>\n<td>2 + 6 = 8</td>\n<td>H–O–H, 2 lone pairs on O</td>\n</tr>\n<tr>\n<td>NO₃⁻</td>\n<td>5 + 18 + 1 = 24</td>\n<td>N central, one N=O, two N–O⁻ (resonance)</td>\n</tr>\n</tbody>\n</table></div>\n<h3>2B.2 Resonance</h3>\n<ul>\n<li>When several Lewis structures differ <strong>only in where the electrons (double bonds) sit</strong>, not in where the atoms are, the real molecule is a <strong>resonance hybrid</strong>, a blend of all of them. Draw them with double-headed arrows (↔) between.</li>\n<li>The molecule does <strong>not</strong> flip back and forth. All equivalent bonds are identical, with a bond order in between.</li>\n<li><strong>NO₃⁻:</strong> 3 resonance structures. Each N–O bond has order 1⅓.</li>\n<li><strong>O₃:</strong> 2 resonance structures (O=O–O ↔ O–O=O). Both O–O bonds are the same length.</li>\n<li><strong>Benzene, C₆H₆:</strong> two Kekulé structures with alternating single and double bonds. All six C–C bonds are actually identical (between single and double in length).</li>\n<li>Resonance spreads electrons out (delocalizes them) and lowers the energy, which makes the molecule more stable.</li>\n</ul>\n<h3>2B.3 Formal charge</h3>\n<p>Formal charge tells you which arrangement of atoms and electrons is most likely when you can't run an experiment. It assumes <strong>every bond is shared perfectly equally</strong>.</p>\n<div class=\"formula\">FC = V − (L + ½B)</div>\n\n<p>V = valence electrons of the free atom, L = number of lone-pair electrons on the atom, B = number of bonding electrons around it. Shortcut: <strong>FC = V − dots − lines</strong>.</p>\n<p><strong>Rules for picking the best structure:</strong></p>\n<ol>\n<li>Formal charges <strong>closest to zero</strong> usually mean the lowest energy.</li>\n<li>Smaller charges (+1 or −1) beat larger ones (±2).</li>\n<li>If a negative formal charge is needed, put it on the <strong>most electronegative</strong> atom (O, F, N).</li>\n<li>Check: the formal charges always <strong>add up to the overall charge</strong> of the molecule or ion.</li>\n</ol>\n<p><strong>Worked example: NCO⁻ (16 e⁻)</strong></p>\n<div class=\"scroll\"><table class=\"nt\">\n<thead>\n<tr>\n<th>Structure</th>\n<th>FC on N</th>\n<th>FC on C</th>\n<th>FC on O</th>\n<th>Verdict</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>[N≡C–O]⁻ (N: 1 LP, O: 3 LP)</td>\n<td>0</td>\n<td>0</td>\n<td>−1</td>\n<td><strong>Best</strong>: −1 on the most electronegative atom</td>\n</tr>\n<tr>\n<td>[N=C=O]⁻ (2 LP each)</td>\n<td>−1</td>\n<td>0</td>\n<td>0</td>\n<td>OK, but −1 is on N</td>\n</tr>\n<tr>\n<td>[N–C≡O]⁻ (N: 3 LP, O: 1 LP)</td>\n<td>−2</td>\n<td>0</td>\n<td>+1</td>\n<td>Worst: large charges, + on O</td>\n</tr>\n</tbody>\n</table></div>\n<p>More formal-charge checks: N in NH₄⁺ = 5 − 0 − 4 = <strong>+1</strong>. Central O in O₃ = 6 − 2 − 3 = <strong>+1</strong>; single-bonded O = 6 − 6 − 1 = <strong>−1</strong>.</p>\n<p><strong>Formal charge vs. oxidation number:</strong> formal charge exaggerates the covalent character (equal sharing). Oxidation number exaggerates the ionic character (the more electronegative atom gets both bonding electrons). Neither is a real charge.</p>", "words": 751}, {"id": "2C", "t": "Topic 2C · Beyond the octet", "h": "Topic 2C: Beyond the octet rule (Lecture 24)", "html": "<p><strong>C, N, O, and F obey the octet rule strictly.</strong> Other atoms can break it in three ways: an odd number of electrons (radicals), more than 8 electrons (expanded valence shells, period 3 and below), or fewer than 8 (incomplete octets, mainly B and Be).</p>\n<h3>2C.1 Radicals and biradicals</h3>\n<ul>\n<li>A <strong>radical</strong> has an unpaired electron, which you can't avoid when the valence total is <strong>odd</strong>. Radicals are usually very reactive.</li>\n<li>Examples: NO (5 + 6 = 11 e⁻), NO₂ (17 e⁻), ClO₂ (19 e⁻), CH₃ (7 e⁻), OH (7 e⁻).</li>\n<li>NO: N=O, with 2 lone pairs on O and 1 lone pair + 1 single electron on N. N has 7 electrons around it; all formal charges are 0.</li>\n<li>A <strong>biradical</strong> has two unpaired electrons (on the same or different atoms). O₂ is the famous example: it is magnetic even though its Lewis structure shows all electrons paired.</li>\n</ul>\n<h3>2C.2 Expanded valence shells</h3>\n<ul>\n<li>A central atom in <strong>period 3 or below</strong> (P, S, Cl, Br, I, Xe…) can hold <strong>more than 8</strong> electrons, as lone pairs or bonding pairs. This is an <strong>expanded octet</strong>. The textbook explains it with the empty d orbitals available in those shells.</li>\n<li>Compounds with more atoms attached than the octet allows are called <strong>hypervalent</strong> (for example PCl₅, SF₆).</li>\n<li>Period 2 atoms can't do this: there are no 2d orbitals.</li>\n<li><strong>Where to put leftover electrons:</strong> after every outer atom has its octet, any electrons left go on the central atom.</li>\n</ul>\n<div class=\"scroll\"><table class=\"nt\">\n<thead>\n<tr>\n<th>Species</th>\n<th>Valence e⁻</th>\n<th>Around the central atom</th>\n<th>Formal charges</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>I₃⁻</td>\n<td>3(7) + 1 = 22</td>\n<td>2 bonds + 3 lone pairs = 10 e⁻</td>\n<td>central I −1, outer I 0</td>\n</tr>\n<tr>\n<td>SF₄</td>\n<td>6 + 28 = 34</td>\n<td>4 bonds + 1 lone pair = 10 e⁻</td>\n<td>all 0</td>\n</tr>\n<tr>\n<td>SF₆</td>\n<td>6 + 42 = 48</td>\n<td>6 bonds = 12 e⁻</td>\n<td>all 0</td>\n</tr>\n<tr>\n<td>PCl₅</td>\n<td>5 + 35 = 40</td>\n<td>5 bonds = 10 e⁻</td>\n<td>all 0</td>\n</tr>\n<tr>\n<td>XeF₄</td>\n<td>8 + 28 = 36</td>\n<td>4 bonds + 2 lone pairs = 12 e⁻</td>\n<td>all 0</td>\n</tr>\n<tr>\n<td>ClO₄⁻ (best)</td>\n<td>7 + 24 + 1 = 32</td>\n<td>3 Cl=O + 1 Cl–O⁻ = 14 e⁻</td>\n<td>Cl 0, one O −1</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Using formal charge to decide whether to expand (lecture example: perchlorate):</strong></p>\n<ul>\n<li>Octet version: 4 Cl–O single bonds, 3 lone pairs on each O. FC(Cl) = 7 − 0 − 4 = <strong>+3</strong>; each O = <strong>−1</strong>. Large charges.</li>\n<li>Expanded version: 3 Cl=O double bonds + 1 Cl–O. FC(Cl) = 7 − 0 − 7 = <strong>0</strong>; only one O is −1. Smaller charges, so this is preferred.</li>\n<li>The −1 can sit on any of the 4 O atoms, so the ion is a resonance hybrid of 4 structures. The same reasoning applies to SO₄²⁻ and PO₄³⁻.</li>\n</ul>\n<h3>2C.3 Incomplete octets</h3>\n<ul>\n<li><strong>Group 13 atoms (especially B)</strong> are often stable with only <strong>6</strong> valence electrons. Be (BeCl₂) can have only 4.</li>\n<li><strong>BF₃:</strong> three B–F single bonds; B has 6 e⁻; all formal charges are 0.</li>\n<li>Why not draw a B=F double bond to give B an octet? That puts <strong>−1 on B and +1 on F</strong>, a positive charge on the most electronegative element. Unfavorable, so the single-bond structure wins.</li>\n<li>The empty spot on B makes BF₃ eager to accept a lone pair from another molecule (BF₃ + NH₃ → F₃B–NH₃).</li>\n<li><strong>AlCl₃</strong> reaches an octet differently: two units pair up as Al₂Cl₆, with Cl atoms bridging the two Al atoms.</li>\n</ul>", "words": 562}, {"id": "2D", "t": "Topic 2D · Bond properties", "h": "Topic 2D: The properties of bonds (from the textbook; likely in this week's lectures)", "html": "<p>Real bonds sit on a scale from purely covalent to purely ionic. <strong>Electronegativity difference</strong> tells you where a bond falls. Bond strength and length follow from bond order and atom size.</p>\n<h3>2D.1 Correcting the covalent model: electronegativity</h3>\n<ul>\n<li>Every bond is a resonance blend of covalent and ionic structures. In Cl₂ the two ionic forms (Cl⁺ Cl⁻ and Cl⁻ Cl⁺) contribute equally, so there's no net charge. In HCl, Cl pulls harder, so there are <strong>partial charges</strong>: δ+H–Clδ−.</li>\n<li><strong>Polar covalent bond</strong> = a bond with partial charges. Every bond between two <em>different</em> elements is polar to some extent. Bonds in homonuclear diatomics (H₂, O₂, Cl₂) are nonpolar.</li>\n<li>Partial charges make an <strong>electric dipole</strong>. Its size is the <strong>dipole moment</strong> μ, in debye (D). One electron and one proton 100 pm apart = 4.80 D. HCl ≈ 1.1 D (about 23% of an electron's charge on Cl). This textbook draws the dipole arrow pointing toward the <em>positive</em> end (modern convention).</li>\n<li><strong>Electronegativity (χ)</strong> = an atom's electron-pulling power when it's in a molecule (Pauling's scale). Mulliken's version: the average of ionization energy and electron affinity, so high IE + high Eea = high χ.</li>\n<li><strong>Trend:</strong> increases left to right and up a group. <strong>F is the highest (3.98)</strong>, then O (3.44), N and Cl (\\~3.0–3.2). Lowest: Cs, Fr (bottom-left).</li>\n</ul>\n<div class=\"scroll\"><table class=\"nt\">\n<thead>\n<tr>\n<th>Element</th>\n<th>χ</th>\n<th>Element</th>\n<th>χ</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>F</td>\n<td>3.98</td>\n<td>C</td>\n<td>2.55</td>\n</tr>\n<tr>\n<td>O</td>\n<td>3.44</td>\n<td>S</td>\n<td>2.58</td>\n</tr>\n<tr>\n<td>Cl</td>\n<td>3.16</td>\n<td>H</td>\n<td>2.20</td>\n</tr>\n<tr>\n<td>N</td>\n<td>3.04</td>\n<td>Mg</td>\n<td>1.31</td>\n</tr>\n<tr>\n<td>Br</td>\n<td>2.96</td>\n<td>Na</td>\n<td>0.93</td>\n</tr>\n<tr>\n<td>I</td>\n<td>2.66</td>\n<td>K</td>\n<td>0.82</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Rule of thumb for bond type (Δχ = the difference):</strong></p>\n<ul>\n<li>Δχ ≈ <strong>2 or more</strong> → best treated as <strong>ionic</strong> (NaCl: 3.16 − 0.93 = 2.23).</li>\n<li>Δχ <strong>below about 1.5</strong> → <strong>covalent</strong> is a fine description; polar if Δχ &gt; 0 (C–O: 0.89, polar covalent).</li>\n<li>In between: substantial ionic character (Mg–Cl: 1.85).</li>\n</ul>\n<h3>2D.2 Correcting the ionic model: polarizability</h3>\n<ul>\n<li>Every ionic bond has some covalent character. A cation pulls the anion's electron cloud toward itself, piling electron density between the nuclei.</li>\n<li><strong>Polarizable</strong> = an electron cloud that distorts easily. <strong>Large anions</strong> are highly polarizable (I⁻ ≫ F⁻), because their outer electrons feel a small Zeff. Cations are barely polarizable.</li>\n<li><strong>Polarizing power</strong> = the ability to distort a neighbor. <strong>Small, highly charged cations</strong> have high polarizing power (Al³⁺, Be²⁺, Li⁺).</li>\n<li>Polarizing power increases across a period (Li⁺ &lt; Be²⁺; Na⁺ &lt; Mg²⁺) and decreases down a group (Li⁺ &gt; Na⁺).</li>\n<li><strong>Small, highly charged cation + large anion</strong> → lots of covalent character (AlI₃ is more covalent than NaF).</li>\n</ul>\n<h3>2D.3 Bond strengths</h3>\n<ul>\n<li>Bond strength = the <strong>dissociation energy D</strong>: the energy to pull the two bonded atoms completely apart (each atom keeps one electron). On a potential-energy curve, D is the depth of the well.</li>\n<li>Strongest bond between two nonmetal atoms: the C≡O triple bond in carbon monoxide (1062 kJ/mol). Very weak: I–I (151 kJ/mol).</li>\n<li><strong>Higher bond order → stronger bond:</strong> N≡N (944) &gt; O=O (496) &gt; F–F (158 kJ/mol). The N₂ triple bond is why N₂ is unreactive.</li>\n<li>A double bond is <strong>not twice</strong> as strong as a single bond: C=C 612 vs 2 × C–C = 696. A triple bond is much less than three times: C≡C 837 vs 3 × 348 = 1044. The electron pairs in a multiple bond repel each other.</li>\n<li>Bonds get <strong>weaker down a group</strong> as atoms get bigger: H–F 565 &gt; H–Cl 431 &gt; H–Br 366 &gt; H–I 299 kJ/mol.</li>\n<li>Lone pairs on neighboring atoms weaken a bond (part of why F–F is so weak).</li>\n<li>Tables of average bond energies (C–H 412, O–H 463, C–O 360, C=O 743 kJ/mol) are averages over many molecules, so they're typical, not exact.</li>\n</ul>\n<h3>2D.4 Bond lengths</h3>\n<ul>\n<li>Bond length = the distance between the nuclei at the bottom of the potential-energy well. Bonds between period 2 atoms are usually 100–150 pm.</li>\n<li><strong>Higher bond order → shorter bond:</strong> C–C 154 &gt; C=C 134 &gt; C≡C 120 pm. <strong>For the same two atoms, stronger = shorter.</strong></li>\n<li><strong>Resonance averages:</strong> benzene's C–C bonds are 139 pm, between single and double.</li>\n<li><strong>Bigger atoms → longer bonds:</strong> bond length increases down a group.</li>\n<li><strong>Covalent radius</strong> = an atom's contribution to a bond length. Add two radii to estimate a bond: C (77 pm) + Cl (99 pm) ≈ 176 pm for C–Cl. An atom in a multiple bond has a smaller covalent radius.</li>\n</ul>", "words": 711}, {"id": "2E", "t": "Topic 2E · VSEPR", "h": "Topic 2E: The VSEPR model (from the textbook; likely in upcoming lectures)", "html": "<p>VSEPR (valence-shell electron-pair repulsion) predicts a molecule's 3-D shape from its Lewis structure: regions of electrons around the central atom spread as far apart as possible. Count the regions to get the <strong>electron arrangement</strong>; name the <strong>shape</strong> from the atoms alone.</p>\n<h3>2E.1 The basic VSEPR model</h3>\n<ul>\n<li><strong>Rule 1:</strong> regions of high electron concentration (bonds and lone pairs on the central atom) repel each other and move as far apart as possible.</li>\n<li>A <strong>double or triple bond counts as one region</strong>, the same as a single bond.</li>\n<li>With no lone pairs (AXₙ), the shape is the same as the electron arrangement.</li>\n</ul>\n<div class=\"scroll\"><table class=\"nt\">\n<thead>\n<tr>\n<th>Regions</th>\n<th>Electron arrangement</th>\n<th>Bond angles</th>\n<th>Example (no lone pairs)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2</td>\n<td>Linear</td>\n<td>180°</td>\n<td>BeCl₂, CO₂</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Trigonal planar</td>\n<td>120°</td>\n<td>BF₃, NO₃⁻, SO₃</td>\n</tr>\n<tr>\n<td>4</td>\n<td>Tetrahedral</td>\n<td>109.5°</td>\n<td>CH₄, NH₄⁺</td>\n</tr>\n<tr>\n<td>5</td>\n<td>Trigonal bipyramidal</td>\n<td>90°, 120°, 180°</td>\n<td>PCl₅</td>\n</tr>\n<tr>\n<td>6</td>\n<td>Octahedral</td>\n<td>90°, 180°</td>\n<td>SF₆</td>\n</tr>\n</tbody>\n</table></div>\n<h3>2E.2 Molecules with lone pairs on the central atom</h3>\n<ul>\n<li><strong>Rule 3:</strong> lone pairs count when you find the <em>electron arrangement</em>, but the <em>shape</em> is named only from where the atoms are.</li>\n<li><strong>Rule 2:</strong> lone pairs repel more strongly than bonding pairs (lone–lone &gt; lone–bond &gt; bond–bond). They squeeze the bond angles: CH₄ 109.5° &gt; NH₃ 107° &gt; H₂O 104.5°.</li>\n<li>A single unpaired electron (in a radical such as NO₂) acts like a lone pair, so NO₂ is angular.</li>\n<li>In a trigonal bipyramid, lone pairs go in the <strong>equatorial</strong> positions (more room). In an octahedron, two lone pairs sit <strong>opposite</strong> each other.</li>\n<li><strong>VSEPR formula AXₙEₘ:</strong> A = central atom, X = attached atoms, E = lone pairs.</li>\n</ul>\n<div class=\"scroll\"><table class=\"nt\">\n<thead>\n<tr>\n<th>VSEPR formula</th>\n<th>Electron arrangement</th>\n<th>Shape</th>\n<th>Example</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>AX₂E</td>\n<td>Trigonal planar</td>\n<td>Angular (bent), &lt; 120°</td>\n<td>SO₂, O₃, NO₂</td>\n</tr>\n<tr>\n<td>AX₃E</td>\n<td>Tetrahedral</td>\n<td>Trigonal pyramidal, \\~107°</td>\n<td>NH₃, NF₃, SO₃²⁻</td>\n</tr>\n<tr>\n<td>AX₂E₂</td>\n<td>Tetrahedral</td>\n<td>Angular (bent), \\~104.5°</td>\n<td>H₂O</td>\n</tr>\n<tr>\n<td>AX₄E</td>\n<td>Trigonal bipyramidal</td>\n<td>Seesaw</td>\n<td>SF₄</td>\n</tr>\n<tr>\n<td>AX₃E₂</td>\n<td>Trigonal bipyramidal</td>\n<td>T-shaped</td>\n<td>ClF₃</td>\n</tr>\n<tr>\n<td>AX₂E₃</td>\n<td>Trigonal bipyramidal</td>\n<td>Linear</td>\n<td>I₃⁻, XeF₂</td>\n</tr>\n<tr>\n<td>AX₅E</td>\n<td>Octahedral</td>\n<td>Square pyramidal</td>\n<td>BrF₅, IF₅</td>\n</tr>\n<tr>\n<td>AX₄E₂</td>\n<td>Octahedral</td>\n<td>Square planar</td>\n<td>XeF₄, ICl₄⁻</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Method:</strong> (1) draw the Lewis structure, (2) count regions on the central atom (bonds as 1 each + lone pairs), (3) pick the electron arrangement, (4) name the shape from the atom positions only.</p>\n<p>Worked example, NF₃: N has 3 bonds + 1 lone pair = 4 regions → tetrahedral arrangement → <strong>trigonal pyramidal</strong> shape.</p>\n<h3>2E.3 Polar molecules</h3>\n<ul>\n<li>A <strong>polar molecule</strong> has a nonzero dipole moment. A diatomic is polar if its bond is polar (HCl, 1.1 D). Homonuclear diatomics (O₂, N₂, Cl₂) are nonpolar.</li>\n<li>A polyatomic molecule with polar bonds can still be <strong>nonpolar</strong> if the bond dipoles cancel by symmetry:</li>\n<li>CO₂ (linear): the two C=O dipoles point opposite ways, so it's <strong>nonpolar</strong>. H₂O (bent, 104.5°): they don't cancel, so it's <strong>polar</strong>.</li>\n<li>CCl₄ (tetrahedral, 4 identical atoms): <strong>nonpolar</strong>. CHCl₃ or NH₃ (a different atom or a lone pair breaks the symmetry): <strong>polar</strong>.</li>\n<li>trans-dichloroethene: C–Cl dipoles cancel, nonpolar. cis-dichloroethene: polar.</li>\n<li>Quick test: symmetric shapes with all identical outer atoms (linear AX₂, trigonal planar AX₃, tetrahedral AX₄, AX₅, AX₆, square planar AX₄E₂, linear AX₂E₃) are nonpolar. Lone pairs that break the symmetry (AX₃E, AX₂E₂, AX₄E) make the molecule polar.</li>\n</ul>", "words": 500}, {"id": "S2", "t": "Section 2 review · Fund. M, 1A–1D", "h": "Final section 2 review: Fundamentals M and Topics 1A–1D", "html": "<p>You scored 80% on Midterm 2. Most of this section is calculator work with five equations from the equation sheet, plus concept questions about light and orbitals. Your Midterm 2 is redone as worked examples below.</p>\n<h3>Fundamentals M: Limiting reactants</h3>\n<ul>\n<li>Always work in <strong>moles</strong>: grams → moles → coefficient ratio → moles → grams.</li>\n<li><strong>Limiting reactant</strong> = the one that runs out first. Compute how much product <em>each</em> reactant could make; the smallest amount wins.</li>\n<li><strong>Theoretical yield</strong> = the amount of product the limiting reactant allows. <strong>Excess left over</strong> = starting amount − amount used by the limiting reactant.</li>\n</ul>\n<div class=\"formula\">% yield = (actual yield ÷ theoretical yield) × 100%</div>\n\n<p>Midterm 2 #1: CaC₂ + 2H₂O → Ca(OH)₂ + C₂H₂. 100. g CaC₂ ÷ 64.1 = 1.56 mol → 1.56 mol C₂H₂ × 26.0 = 40.6 g theoretical. 12.2 ÷ 40.6 = <strong>30%</strong>.</p>\n<h3>Topic 1A: Investigating atoms (light and spectra)</h3>\n<ul>\n<li><strong>Nuclear model:</strong> a tiny, dense, positive nucleus with electrons around it. (History is not tested.)</li>\n<li><strong>Electromagnetic radiation</strong> = oscillating electric and magnetic fields. In vacuum, <em>all</em> of it travels at c = 3.00 × 10⁸ m/s, whatever the frequency.</li>\n<li><strong>Wavelength λ</strong> = peak-to-peak distance. <strong>Frequency ν</strong> = cycles per second (Hz = s⁻¹). <strong>Amplitude</strong> = height of the wave, which sets the <strong>intensity (brightness)</strong>, not the energy per photon.</li>\n<li>Spectrum from low to high energy: radio, microwave, infrared, <strong>visible (red \\~700 nm → violet \\~400 nm)</strong>, ultraviolet, X-ray, gamma ray.</li>\n<li><strong>White light</strong> = a mixture of all visible wavelengths.</li>\n</ul>\n<div class=\"formula\">c = λν</div>\n\n<ul>\n<li><strong>Atomic spectra:</strong> an H atom only has certain energy levels, so it absorbs and emits only certain wavelengths (lines). <strong>Emission</strong> = an electron drops from a higher n to a lower n and gives off a photon. The electron does not leave the atom (Midterm 2 #5 trap). <strong>Absorption</strong> = the reverse.</li>\n<li>Energy levels get <strong>closer together</strong> as n increases.</li>\n</ul>\n<div class=\"formula\">ν = R(1/n₁² − 1/n₂²) &nbsp;·&nbsp; R = 3.29 × 10¹⁵ Hz</div>\n\n<p>Midterm 2 #6 (n = 5 → 1): ν = 3.29 × 10¹⁵ × (1 − 1/25) = 3.16 × 10¹⁵ Hz → λ = c/ν = <strong>95.0 nm</strong> (UV). Transitions to n = 1 are UV (Lyman); to n = 2 are visible (Balmer).</p>\n<h3>Topic 1B: Quantum theory</h3>\n<ul>\n<li><strong>Blackbody radiation</strong> led to the idea that energy comes in packets (quanta). Skim only.</li>\n<li><strong>Photons:</strong> light is a stream of particles, each with energy E = hν.</li>\n</ul>\n<div class=\"formula\">E = hν = hc/λ &nbsp;·&nbsp; h = 6.626 × 10⁻³⁴ J s</div>\n\n<ul>\n<li>For a mole of photons, multiply by Nₐ = 6.022 × 10²³. Midterm 2 #7: hc/(101.6 nm) = 1.96 × 10⁻¹⁸ J × Nₐ = <strong>1.18 MJ</strong>.</li>\n<li><strong>Photoelectric effect:</strong> one photon ejects one electron, but only if hν ≥ the metal's threshold (work function). Below threshold: no electrons, however bright. Above threshold: brighter light → <strong>more</strong> electrons; higher frequency → <strong>faster</strong> electrons (KE = hν − threshold).</li>\n<li>Midterm 2 #9: threshold 3.89 × 10⁻¹⁹ J → λ = hc/E = 511 nm (green). Green, blue, indigo, and violet all work.</li>\n<li><strong>Wave–particle duality (de Broglie):</strong> matter behaves like waves too. Heavy or fast objects have tiny wavelengths.</li>\n</ul>\n<div class=\"formula\">λ = h/(mv)</div>\n\n<ul>\n<li>Midterm 2 #10: v = h/(mλ) = 6.626 × 10⁻³⁴ / (1.67 × 10⁻²⁷ × 6.54 × 10⁻⁶) = <strong>0.0607 m/s</strong>.</li>\n<li><strong>Uncertainty principle:</strong> you can't know an electron's position and momentum exactly at the same time.</li>\n</ul>\n<div class=\"formula\">Δp·Δx ≥ h/(4π) &nbsp;·&nbsp; Δp = mΔv</div>\n\n<ul>\n<li>Midterm 2 #8: Δx = 6.626 × 10⁻³⁴ / (4π × 9.109 × 10⁻³¹ × 1 × 10⁴) = <strong>5.8 nm</strong>. Use Δv (the uncertainty), not v. Don't forget the 4π.</li>\n</ul>\n<h3>Topic 1C: Wavefunctions and energy levels</h3>\n<ul>\n<li>An electron in an atom is described by a <strong>wavefunction ψ</strong>. <strong>ψ²</strong> gives the probability density of finding it at a point (Born interpretation).</li>\n<li>Confining a wave forces its energy to be <strong>quantized</strong> (only certain values allowed). A particle in a box is the simple model: allowed energies go as n², and there is a nonzero lowest energy.</li>\n<li>The electron in an atom behaves as a <strong>standing wave</strong>, not a tiny ball on a path.</li>\n</ul>\n<h3>Topic 1D: The hydrogen atom (orbitals and quantum numbers)</h3>\n<div class=\"formula\">E<sub>n</sub> = −hR/n² = −(2.18 × 10⁻¹⁸ J)/n²</div>\n\n<ul>\n<li>Midterm 2 #11: 2.18 × 10⁻¹⁸ / 8.72 × 10⁻²⁰ = 25 = n² → <strong>n = 5</strong>. Midterm 2 #12: ratio = 4 → n = 2 → the electron is in the 2s, 2pₓ, 2pᵧ, <strong>or</strong> 2p_z orbital (one at a time).</li>\n<li>In hydrogen, all orbitals with the same n have the same energy (<strong>degenerate</strong>).</li>\n</ul>\n<div class=\"scroll\"><table class=\"nt\">\n<thead>\n<tr>\n<th>Quantum number</th>\n<th>Allowed values</th>\n<th>What it sets</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>n (principal)</td>\n<td>1, 2, 3, …</td>\n<td>Shell; energy and size</td>\n</tr>\n<tr>\n<td>l (orbital angular momentum)</td>\n<td>0 to n − 1 (s = 0, p = 1, d = 2, f = 3)</td>\n<td>Subshell; shape</td>\n</tr>\n<tr>\n<td>mₗ (magnetic)</td>\n<td>−l to +l (2l + 1 values)</td>\n<td>Orientation (which orbital)</td>\n</tr>\n<tr>\n<td>mₛ (spin)</td>\n<td>+½ or −½</td>\n<td>Spin up or down</td>\n</tr>\n</tbody>\n</table></div>\n<ul>\n<li>A shell n has <strong>n² orbitals</strong> and holds <strong>2n² electrons</strong>. Subshells: s has 1 orbital, p has 3, d has 5, f has 7.</li>\n<li>3p: mₗ = −1, 0, +1. 3s: mₗ = 0 only (Midterm 2 #15 and the homework).</li>\n<li><strong>Nodes:</strong> radial nodes = n − l − 1; angular nodes (planes) = l; total = n − 1. 2s has 1 radial node; 3p has 1 radial + 1 angular; 3d has 0 radial + 2 angular.</li>\n<li><strong>Shapes:</strong> s = sphere; p = two lobes along an axis (3 orientations); d = mostly four lobes (5 orbitals). On a radial distribution plot, the number of humps = radial nodes + 1.</li>\n<li><strong>What an orbital is:</strong> a 3-D standing wave. The electron does <strong>not</strong> hop between lobes; it's one wave spread over all of them (Midterm 2 #14 trap). Ground-state H is 1s, so only an excited H electron can be in 2p, 3d, and so on.</li>\n<li><strong>Electron spin:</strong> two states (↑ and ↓), mₛ = ±½. Two electrons in one orbital must have opposite spins (Pauli).</li>\n</ul>", "words": 989}, {"id": "S1", "t": "Section 1 review · Fund. A–I, L", "h": "Final section 1 review: Fundamentals A–I and L", "html": "<p>You scored 76% on Midterm 1, so this is the section with the most room to improve. It is mostly fast conversions: practice until each type takes under a minute. Forces and energy (A.3, A.4) are not tested.</p>\n<h3>Fundamentals A: Matter and energy (units, sig figs)</h3>\n<div class=\"scroll\"><table class=\"nt\">\n<thead>\n<tr>\n<th>Prefix</th>\n<th>Symbol</th>\n<th>Factor</th>\n<th>Prefix</th>\n<th>Symbol</th>\n<th>Factor</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>giga</td>\n<td>G</td>\n<td>10⁹</td>\n<td>centi</td>\n<td>c</td>\n<td>10⁻²</td>\n</tr>\n<tr>\n<td>mega</td>\n<td>M</td>\n<td>10⁶</td>\n<td>milli</td>\n<td>m</td>\n<td>10⁻³</td>\n</tr>\n<tr>\n<td>kilo</td>\n<td>k</td>\n<td>10³</td>\n<td>micro</td>\n<td>µ</td>\n<td>10⁻⁶</td>\n</tr>\n<tr>\n<td>—</td>\n<td>—</td>\n<td>10⁰</td>\n<td>nano</td>\n<td>n</td>\n<td>10⁻⁹</td>\n</tr>\n<tr>\n<td>peta / tera</td>\n<td>P / T</td>\n<td>10¹⁵ / 10¹²</td>\n<td>pico / femto</td>\n<td>p / f</td>\n<td>10⁻¹² / 10⁻¹⁵</td>\n</tr>\n</tbody>\n</table></div>\n<ul>\n<li>Convert through the base unit: 92,300,000 µg × 10⁻⁶ = <strong>92.3 g</strong> (MT1 #1). 6.2 m = <strong>6,200 mm</strong> (#3). 1.0 µm = 1000 nm ÷ 0.154 nm = <strong>6.5 × 10³</strong> bond lengths (#7).</li>\n<li>Useful: 1 mL = 1 cm³; 0 °C = 273.15 K; density = mass/volume.</li>\n<li><strong>Significant figures:</strong> leading zeros don't count (0.00450 has 3); trailing zeros after a decimal point do; × and ÷ keep the fewest sig figs; + and − keep the fewest decimal places. Exact counts (like 12 eggs) don't limit sig figs.</li>\n<li><strong>Reading a scale:</strong> record every certain digit plus one estimated digit (one place past the smallest marking).</li>\n<li><strong>Accuracy</strong> = closeness to the true value. <strong>Precision</strong> = closeness of repeated measurements to each other.</li>\n</ul>\n<h3>Fundamentals B: Elements and atoms</h3>\n<ul>\n<li><strong>Nucleus</strong> = protons + neutrons (each ≈ 1.67 × 10⁻²⁷ kg), tiny and dense: almost all the mass. <strong>Electrons</strong> (9.11 × 10⁻³¹ kg, about 1/1836 of a proton) fill the space around it as a cloud.</li>\n<li><strong>Atomic number Z</strong> = protons. <strong>Mass number A</strong> = protons + neutrons. Neutral atom: electrons = Z. Ion: electrons = Z − charge.</li>\n<li><strong>Isotopes</strong> = same Z, different number of neutrons. ⁵⁶Fe³⁺ has 26 p, 30 n, 23 e⁻.</li>\n<li>Most H atoms have 0 neutrons; most He atoms have 2; Cl has two stable isotopes (Cl-35 and Cl-37) (MT1 #14).</li>\n<li>MT1 #10: 9 electrons ÷ total mass of F (9 p + 10 n + 9 e) = <strong>0.0258%</strong> of the mass.</li>\n<li>Periodic table layout: groups (columns) and periods (rows); metals left, nonmetals right, metalloids on the staircase.</li>\n</ul>\n<h3>Fundamentals C: Compounds</h3>\n<ul>\n<li><strong>Molecular compounds</strong> = discrete molecules of nonmetals sharing electrons (CH₄, O₂, H₂O, CO₂).</li>\n<li><strong>Ionic compounds</strong> = cations + anions in a lattice, with no discrete molecules (NaCl, KNO₃, NH₄ClO). They are <strong>overall neutral</strong>: the charges cancel.</li>\n<li>MT1 #12: discrete molecules = <strong>CH₄ and O₂</strong> only.</li>\n<li>Typical charges: group 1 → +1, group 2 → +2, Al → +3, group 16 → −2, group 17 → −1.</li>\n</ul>\n<h3>Fundamentals D: Nomenclature</h3>\n<ul>\n<li>Monatomic anions end in <strong>-ide</strong>: chloride, oxide, sulfide, nitride.</li>\n<li>Transition-metal cations show their charge in Roman numerals: iron(III) chloride = FeCl₃.</li>\n<li>Balance the charges to write the formula: Mg²⁺ + CrO₄²⁻ → <strong>MgCrO₄</strong> (MT1 #5); Mg²⁺ + 2 MnO₄⁻ → <strong>Mg(MnO₄)₂</strong> (#11). In water it gives MnO₄⁻ ions, not Mn²⁺.</li>\n</ul>\n<div class=\"scroll\"><table class=\"nt\">\n<thead>\n<tr>\n<th>Ion</th>\n<th>Formula</th>\n<th>Ion</th>\n<th>Formula</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Ammonium</td>\n<td>NH₄⁺</td>\n<td>Carbonate</td>\n<td>CO₃²⁻</td>\n</tr>\n<tr>\n<td>Hydroxide</td>\n<td>OH⁻</td>\n<td>Sulfate / sulfite</td>\n<td>SO₄²⁻ / SO₃²⁻</td>\n</tr>\n<tr>\n<td>Nitrate / nitrite</td>\n<td>NO₃⁻ / NO₂⁻</td>\n<td>Phosphate</td>\n<td>PO₄³⁻</td>\n</tr>\n<tr>\n<td>Acetate</td>\n<td>CH₃COO⁻</td>\n<td>Chromate / dichromate</td>\n<td>CrO₄²⁻ / Cr₂O₇²⁻</td>\n</tr>\n<tr>\n<td>Permanganate</td>\n<td>MnO₄⁻</td>\n<td>Perchlorate / chlorate / hypochlorite</td>\n<td>ClO₄⁻ / ClO₃⁻ / ClO⁻</td>\n</tr>\n<tr>\n<td>Cyanide</td>\n<td>CN⁻</td>\n<td>Hydrogen carbonate</td>\n<td>HCO₃⁻</td>\n</tr>\n</tbody>\n</table></div>\n<h3>Fundamentals E: Moles and molar masses</h3>\n<div class=\"formula\">n = m/M &nbsp;·&nbsp; N = n × N<sub>A</sub> &nbsp;·&nbsp; N<sub>A</sub> = 6.022 × 10²³ mol⁻¹</div>\n\n<ul>\n<li>MT1 #2: 1.11 × 10²⁴ ÷ 6.022 × 10²³ = <strong>1.84 mol</strong>. #4: 10.09 g ÷ 20.18 g/mol = <strong>0.500 mol</strong> Ne.</li>\n<li>Atoms inside a formula: multiply by the subscript. #8: 0.68 mol Na₂SO₃ × 2 Na × Nₐ = <strong>8.2 × 10²³</strong> Na atoms.</li>\n<li>Average atomic mass from isotopes: Σ (fraction × isotope mass). For Cl: 34.97x + 36.97(1 − x) = 35.45 → x ≈ 0.76 (76% Cl-35).</li>\n</ul>\n<h3>Fundamentals F: Determination of chemical formulas</h3>\n<ul>\n<li><strong>Mass percent</strong> of an element = (mass of that element in one formula unit ÷ molar mass) × 100.</li>\n<li><strong>Empirical formula from mass %:</strong> assume 100 g (so % becomes g) → divide each by its molar mass → divide by the smallest → multiply to whole numbers if needed.</li>\n<li>MT1 #15: 37.49 g C / 12.01 = 3.12; 12.58 g H / 1.008 = 12.48; 49.93 g O / 16.00 = 3.12 → 1 : 4 : 1 = <strong>CH₄O</strong>.</li>\n<li><strong>Molecular formula</strong> = (empirical formula) × (molar mass ÷ empirical formula mass).</li>\n</ul>\n<h3>Fundamentals G: Mixtures and solutions</h3>\n<div class=\"formula\">c = n<sub>solute</sub> / V<sub>solution</sub> &nbsp;·&nbsp; c₁V₁ = c₂V₂</div>\n\n<ul>\n<li>A solution = solute evenly dispersed in a solvent, at the molecular level. Molarity M = mol/L.</li>\n<li>Handy: <strong>mM × mL = µmol</strong>. MT1 #6: 5.0 mM × 2.6 mL = <strong>13 µmol</strong>. #9: 1.00 mol NaCl in 0.500 L = <strong>2.00 M</strong>.</li>\n<li><strong>Watch ion counts:</strong> 1 mol K₃PO₄ gives 3 mol K⁺. MT1 #16: need [K₃PO₄] = 25.0 mM ÷ 3 = 8.33 mM; V₁ = 8.33 mM × 200 mL ÷ 1800 mM = 0.926 mL = 926 µL, which isn't listed, so the answer was <strong>\"none of the above\"</strong>.</li>\n</ul>\n<h3>Fundamentals H: Chemical equations</h3>\n<ul>\n<li>A balanced equation has the same number of each atom (and the same total charge) on both sides. Coefficients = mole ratios.</li>\n<li>Strategy: balance elements that appear in only one compound per side first; leave lone elements (O₂, H₂) for last; fix fractions by multiplying through.</li>\n<li>Examples: P₄ + 6F₂ → 4PF₃; C₃H₈ + 5O₂ → 3CO₂ + 4H₂O; 4Al + 3O₂ → 2Al₂O₃; CaC₂ + 2H₂O → Ca(OH)₂ + C₂H₂.</li>\n</ul>\n<h3>Fundamentals I: Aqueous solutions and precipitation</h3>\n<ul>\n<li>Ionic compounds that dissolve break into ions (strong electrolytes). A <strong>precipitate</strong> forms when a cation–anion pair is insoluble.</li>\n<li><strong>Solubility rules:</strong></li>\n<li>Always soluble: group 1 cations, NH₄⁺, nitrates, acetates (and perchlorates).</li>\n<li>Cl⁻, Br⁻, I⁻: soluble, except with Ag⁺, Pb²⁺, Hg₂²⁺.</li>\n<li>Sulfates: soluble, except Ba²⁺, Pb²⁺, Ca²⁺, Sr²⁺.</li>\n<li>Carbonates, phosphates, sulfides, hydroxides: mostly insoluble, except with group 1 or NH₄⁺.</li>\n<li><strong>Net ionic equation:</strong> keep only the ions that form the solid. AgNO₃ + NaCl: Ag⁺(aq) + Cl⁻(aq) → AgCl(s). Na⁺ and NO₃⁻ are <strong>spectator ions</strong>.</li>\n</ul>\n<h3>Fundamentals L: Reaction stoichiometry</h3>\n<ul>\n<li>Grams of A → moles of A → (coefficient ratio) → moles of B → grams of B.</li>\n<li>MT1 #17: 4.80 g F₂ ÷ 38.0 = 0.126 mol × (4 PF₃ / 6 F₂) = 0.0842 mol × 88.0 = <strong>7.41 g PF₃</strong>.</li>\n<li>Solution stoichiometry: moles = M × V(L), then the same mole-ratio step.</li>\n</ul>\n<p><em>Not on the Midterm 1 guide:</em> Fundamentals J (acids and bases: Arrhenius and Brønsted, strong vs weak) and K (redox: oxidation numbers, oxidizing and reducing agents). Skim only if time allows.</p>", "words": 1078}];

function S(atoms,bonds,o={}){return {a:atoms.map(([e,x,y,lp=0,r=0])=>({e,x,y,lp,r})),b:bonds,...o}}

function fcOf(m,i){const at=m.a[i];let B=0;m.b.forEach(([x,y,o])=>{if(x===i||y===i)B+=o});return VAL[at.e]-2*at.lp-at.r-B}
function lewisSVG(m){
 const W=260,H=180,P=[];
 const ang=(i)=>m.b.filter(b=>b[0]===i||b[1]===i).map(([x,y])=>{const o=m.a[x===i?y:x],a=m.a[i];return Math.atan2(o.y-a.y,o.x-a.x)});
 const dist=(p,q)=>{let d=Math.abs(p-q)%(2*Math.PI);return d>Math.PI?2*Math.PI-d:d};
 m.b.forEach(([i,j,o])=>{const A=m.a[i],B=m.a[j],dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,nx=-uy,ny=ux,s=16,sa=A.e.length>1?22:16,sb=B.e.length>1?22:16;
  for(let k=0;k<o;k++){const off=(k-(o-1)/2)*6;P.push(`<line x1="${A.x+ux*sa+nx*off}" y1="${A.y+uy*sa+ny*off}" x2="${B.x-ux*sb+nx*off}" y2="${B.y-uy*sb+ny*off}" class="bd"/>`)}});
 m.a.forEach((at,i)=>{
  const used=ang(i),n=at.lp+(at.r?1:0);let chosen=[];
  if(n){const G=[...Array(24)].map((_,k)=>k*Math.PI/12);let bs=-1;
   const score=set=>{const all=used.concat(set);let m=9,sm=0;for(let x=0;x<all.length;x++)for(let y=x+1;y<all.length;y++){const d=dist(all[x],all[y]);m=Math.min(m,d);sm+=d}m=m*100+sm;if(all.length<2)m=Math.PI-Math.abs(set[0]-3*Math.PI/2)/9;return m};
   const rec=(start,set)=>{if(set.length===n){const sc=score(set);if(sc>bs+1e-9){bs=sc;chosen=set.slice()}return}for(let k=start;k<24;k++){set.push(G[k]);rec(k+1,set);set.pop()}};rec(0,[])}
  chosen.forEach((a,k)=>{const r=at.e.length>1?23:16,cx=at.x+Math.cos(a)*r,cy=at.y+Math.sin(a)*r,px=-Math.sin(a)*3.6,py=Math.cos(a)*3.6;
   if(k<at.lp)P.push(`<circle cx="${cx+px}" cy="${cy+py}" r="2.4" class="dt"/><circle cx="${cx-px}" cy="${cy-py}" r="2.4" class="dt"/>`);else P.push(`<circle cx="${cx}" cy="${cy}" r="2.6" class="dt rad"/>`)});
  P.push(`<text x="${at.x}" y="${at.y+6}" class="el">${at.e}</text>`);
  if(m.fc){const f=fcOf(m,i);if(f){P.push(`<text x="${at.x+14}" y="${at.y-12}" class="fc">${f>0?'+'+f:'−'+(-f)}</text>`)}}
 });
 if(m.br){P.push(`<text x="12" y="${H/2+18}" class="brk">[</text><text x="${W-26}" y="${H/2+18}" class="brk">]</text><text x="${W-4}" y="${H/2-30}" class="fc big">${m.br}</text>`)}
 return `<svg viewBox="0 0 ${W} ${H}" class="lew" role="img" aria-label="Lewis structure">${P.join('')}</svg>`;
}

// ---------- SPEED DRILL ----------
const DRILL=['pre','sf','mm','avo','pre','sf','avo','dil'];
function startDrill(){drill={left:60,score:0,n:0,miss:[],cur:null,over:false,from:launchedFrom};nextDrill();go('practice','drill');
 drill.t0=Date.now();drill.tm=setInterval(()=>{if(!drill||drill.over)return;drill.left=Math.max(0,60-Math.floor((Date.now()-drill.t0)/1000));const el=$('#dtm');if(el){el.textContent=drill.left+'s';$('#dbar').style.width=(drill.left/60*100)+'%'}if(drill.left<=0)endDrill()},250)}
function nextDrill(){const id=DRILL[Math.floor(Math.random()*DRILL.length)],g=GENS.find(x=>x.id===id);const r=g.f();const idx=r.o.map((_,i)=>i);drill.cur={...r,t:g.t,id:'g:'+g.id,ord:r.ns?idx:shuf(idx)}}
function endDrill(){if(drill.over)return;drill.over=true;clearInterval(drill.tm);drill.tm=null;if(drill.score>(ST.best||0))ST.best=drill.score;launchedFrom=drill.from;markTask(k=>k.k==='drill');save();render()}
function rDrill(){const d=drill;if(d.over)return `<section class="band quiz"><p class="eyebrow">Speed drill · finished</p><h1>${d.score} correct in 60 s</h1><p class="why">${d.n} answered · best ever: <b>${ST.best}</b>. On the exam, aim to do these in under a minute each, so anything over 6 here is solid.</p>
 ${d.miss.length?`<h2>Misses</h2>${d.miss.map(q=>`<div class="miss"><div>${fm(q.q)}</div><p class="ans">Answer: <b>${fm(q.o[q.a])}</b></p><p class="muted">${fm(q.ex)}</p></div>`).join('')}`:''}<div class="row"><button class="btn" id="dAgain">Go again</button><button class="btn ghost" id="dHome">Back to practice</button></div></section>`;
 const q=d.cur;return `<section class="band quiz"><div class="drillbar"><b id="dtm">${d.left}s</b><span>Score <b>${d.score}</b></span></div><div class="prog"><i id="dbar" style="width:${d.left/60*100}%"></i></div>
 <div class="qq ${d.flash||''}">${fm(q.q)}</div><div class="opts">${q.ord.map((oi,k)=>`<button class="opt" data-do="${oi}"><span class="l">${'abcde'[k]}</span><span class="ot">${fm(q.o[oi])}</span></button>`).join('')}</div><button class="back" id="dq">Stop</button></section>`}

 document.querySelectorAll('[data-do]').forEach(b=>b.onclick=()=>{const q=d.cur,ok=+b.dataset.do===q.a;rec(q.id,q.t,ok);d.n++;if(ok)d.score++;else d.miss.push(q);d.flash=ok?'fl-ok':'fl-bad';nextDrill();render()});

// ---------- GRADE PREDICTOR + BACKUP ----------
const LET=[[100,'A+'],[93,'A'],[90,'A−'],[87,'B+'],[83,'B'],[80,'B−'],[77,'C+'],[73,'C'],[70,'C−'],[60,'D'],[0,'F']];
function secGuess(x){const m=ST.mock[x];if(m&&m.length)return m[m.length-1];const ts=TOPICS.filter(t=>t.sec===x).map(t=>t.id);let c=0,n=0;ts.forEach(t=>{const y=ST.tp[t];if(y){c+=y.c;n+=y.c+y.w}});return n>=10?Math.round(c/n*100):''}
function predHTML(){return `<div class="card pred"><h2>Grade predictor</h2><p class="muted">Pre-filled with your latest mock final section scores (or your practice accuracy). Change any number to try "what if".</p>
 <div class="pin">${[1,2,3].map(x=>`<label>Final section ${x}<input id="ps${x}" type="number" min="0" max="100" inputmode="numeric" value="${secGuess(x)}" placeholder="%"></label>`).join('')}<label>Discussion<input id="pdisc" type="number" min="0" max="100" value="${ST.pdisc??100}"></label></div>
 <label class="chk"><input type="checkbox" id="phw" ${ST.phw===false?'':'checked'}><span>Homework extra credit (+5%)</span></label><div id="pout" class="pout"></div>
 <p class="muted">Uses the syllabus: midterms 25% each, final 40% (three equal sections, assumed), discussion 10%. A final section that beats its midterm replaces it (yours: 76% and 80%). The scale may be lowered at the end, never raised.</p></div>`}
function calcPred(){const v=x=>{const n=parseFloat($('#ps'+x).value);return isNaN(n)?null:Math.min(100,Math.max(0,n))};const s1=v(1),s2=v(2),s3=v(3),disc=Math.min(100,Math.max(0,parseFloat($('#pdisc').value)||0)),hw=$('#phw').checked;ST.pdisc=disc;ST.phw=hw;save();
 if(s1==null||s2==null||s3==null){$('#pout').innerHTML='<p class="muted">Fill in all three section scores to see a prediction.</p>';return}
 const g=(25*Math.max(76,s1)+25*Math.max(80,s2)+40*(s1+s2+s3)/3+10*disc+(hw?500:0))/100,L=LET.find(([c])=>g>=c)[1];
 const need=x=>{for(let t=0;t<=100;t+=.5){const gg=(25*Math.max(76,t)+25*Math.max(80,t)+40*t+10*disc+(hw?500:0))/100;if(gg>=x)return t}return null};const na=need(93);
 $('#pout').innerHTML=`<b class="big">${L}</b><span><b>${g.toFixed(1)}%</b> predicted${na!=null?` · for an A you need about <b>${Math.ceil(na)}%</b> on every section`:' · an A isn\'t reachable with these settings'}</span>`}
function backupHTML(){return `<div class="card"><h2>Back up your progress</h2><p class="muted">Copy this code somewhere safe (Notes, email to yourself). Paste it back here on any device to restore everything.</p>
 <div class="row"><button class="btn ghost" id="bkS">Show backup code</button><button class="btn ghost" id="bkC">Copy</button></div><textarea id="bkT" readonly rows="3" placeholder="Tap “Show backup code”"></textarea>
 <h2>Restore</h2><textarea id="bkR" rows="3" placeholder="Paste a backup code"></textarea><div class="row"><button class="btn" id="bkGo">Restore progress</button><span id="bkMsg" class="muted"></span></div></div>`}
function bindBackup(){const code=()=>btoa(unescape(encodeURIComponent(JSON.stringify(ST))));
 $('#bkS').onclick=()=>{$('#bkT').value=code();$('#bkT').select()};
 $('#bkC').onclick=async()=>{const c=code();$('#bkT').value=c;try{await navigator.clipboard.writeText(c);$('#bkC').textContent='Copied'}catch(e){$('#bkT').select();$('#bkC').textContent='Select + copy'}};
 $('#bkGo').onclick=()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob($('#bkR').value.trim()))));if(!o||typeof o!=='object'||!o.q)throw 0;ST={q:{},tp:{},cards:{},done:{},todo:{},read:{},seen:{},notes:{},mock:{},best:0,...o};save();$('#bkMsg').textContent='Restored.';setTimeout(render,600)}catch(e){$('#bkMsg').textContent='That code didn\'t work. Check you pasted all of it.'}}}

// ---------- CHEAT SHEET ----------
function trendSVG(){const W=600,H=250,ox=30,oy=40,cw=24,ch=26;const cells=[];
 const rows=[[1,18],[1,2,13,14,15,16,17,18],[1,2,13,14,15,16,17,18],[...Array(18)].map((_,i)=>i+1),[...Array(18)].map((_,i)=>i+1),[...Array(18)].map((_,i)=>i+1)];
 rows.forEach((r,ri)=>r.forEach(g=>{const b=g<=2?'sb':g>=13?'pb':'db';cells.push(`<rect x="${ox+(g-1)*cw}" y="${oy+ri*ch}" width="${cw-3}" height="${ch-3}" rx="3" class="${b}"/>`)}));
 return `<svg viewBox="0 0 ${W} ${H}" class="trend" role="img" aria-label="Periodic trends">
 <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" class="ahd"/></marker></defs>${cells.join('')}
 <line x1="${ox+20}" y1="${oy+6*ch+20}" x2="${ox+17*cw}" y2="${oy+6*ch+20}" class="ar a1" marker-end="url(#ah)"/>
 <text x="${ox+9*cw}" y="${oy+6*ch+40}" class="tl">Z<tspan baseline-shift="sub" font-size="10">eff</tspan>, IE, EA ↑ · radius ↓</text>
 <line x1="${ox+18*cw+14}" y1="${oy+6*ch}" x2="${ox+18*cw+14}" y2="${oy+4}" class="ar a2" marker-end="url(#ah)"/>
 <text x="${ox+18*cw+26}" y="${oy+70}" class="tl st">IE, EA ↑</text><text x="${ox+18*cw+26}" y="${oy+88}" class="tl st">radius ↓</text>
 <text x="${ox}" y="${oy-14}" class="tl st">Biggest atoms: bottom-left · highest IE: top-right</text></svg>`}
function rCheat(){const eq=[['c = λν','c = 3.00×10^8 m/s'],['E = hν = hc/λ','h = 6.626×10^{−34} J·s'],['ν = R(1/n_{1}^2 − 1/n_{2}^2)','R = 3.29×10^{15} Hz'],['E_{n} = −hR/n^2','hR = 2.18×10^{−18} J'],['λ = h/(mv)','de Broglie'],['Δp·Δx ≥ h/(4π)','Δp = mΔv'],['radial nodes = n − l − 1','angular = l'],['FC = V − L − B/2','valence − dots − lines'],['M_1V_1 = M_2V_2','mM × mL = µmol'],['% yield = actual/theoretical × 100','']];
 const rules=[['Radius','↑ down a group, ↓ across. Cation &lt; atom &lt; anion. Isoelectronic: more protons = smaller.'],['Ionization energy','↑ up and across. Exceptions: Be &gt; B, N &gt; O. Big jump = core electrons.'],['Electron affinity','+ = released (course sign). ↑ up and across. Cl &gt; F. Low: group 2, group 15, noble gases.'],['Configs','Cr 3d^5 4s^1, Cu 3d^10 4s^1. Ions lose 4s before 3d: Fe^2+ = [Ar]3d^6.'],['Valence e⁻','After the noble gas, minus full lower-n subshells (Ga: 3).'],['Lattice energy','Charge first, then smaller ions. MgO ≫ NaF &gt; NaCl &gt; KCl.'],['Lewis','Count → central (lowest IE) → single bonds → outer lone pairs → leftovers on center → multiple bonds if short.'],['Formal charge','Closest to 0. A negative FC goes on the most electronegative atom.'],['Octet','C N O F strict. Period 3+ can expand (SF_4, I_3^−, XeF_4). B is OK with 6. Odd e⁻ = radical.'],['Orbitals','l ≤ n−1, m_{l} = −l…+l. n^2 orbitals per shell. H: same n = same energy.'],['Bonds','χ: F highest. Δχ ≈ 2 ionic, &lt; 1.5 covalent. Higher bond order = stronger + shorter.'],['VSEPR','Count regions (a multiple bond = 1). Name the shape from atoms only. NH_3 pyramidal, H_2O bent, SF_4 seesaw, XeF_4 square planar.']];
 return `<section class="band"><h1>Cheat sheet</h1><div class="cheat"><div class="card fig2">${trendSVG()}</div>
 <div class="card"><h2>Equations</h2><table class="eq">${eq.map(([a,b])=>`<tr><td>${fm(a)}</td><td class="muted">${fm(b)}</td></tr>`).join('')}</table></div></div>
 <div class="card"><h2>Rules to know cold</h2><dl class="rules">${rules.map(([a,b])=>`<dt>${a}</dt><dd>${fm(b)}</dd>`).join('')}</dl></div></section>`}

function hx(c){c=String(c).trim();if(c[0]!=='#')return null;if(c.length===4)c='#'+c[1]+c[1]+c[2]+c[2]+c[3]+c[3];return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}
const toHex=a=>'#'+a.map(x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,'0')).join('');
const mix=(a,b,t)=>{const A=hx(a),B=hx(b);if(!A||!B)return a;return toHex(A.map((x,i)=>x+(B[i]-x)*t))};

function deriveMode(v,mode){
